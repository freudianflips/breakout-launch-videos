<!doctype html>
<html>
  <body>
    <template>
      <!-- Dot matrix: one grid of dots tells the whole story. The visitor (pink), Breakout (violet) and the rep (cyan)
           are blooms of dots that hop on the beat; ripples are rings of lit dots; the words at the end are dots too.
           Every frame is a pure function of time: frame(t) redraws the grid from nothing. Built by build.py. -->
      <style>
        __FONTFACES__
        #root { position: absolute; inset: 0; overflow: hidden; }
        #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .cap { position: absolute; left: 64px; bottom: 58px; display: none; align-items: center; gap: 14px;
               font-family: "Manrope", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; color: #fff; }
        .cap i { width: 9px; height: 9px; border-radius: 50%; background: #ff5ad1; display: block; }
        #lock { position: absolute; left: 0; right: 0; top: 650px; text-align: center; display: none;
                font-family: "NK", serif; font-weight: 400; font-size: 58px; letter-spacing: -0.03em; color: #fff;
                font-variation-settings: "SOFT" 100, "opsz" 144, "WONK" 0; }
        #lock em { color: #be79ff; }
        #warm { position: absolute; left: -9999px; top: 0; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 20px; }
      </style>
      <div id="root" data-composition-id="dotfilm" data-width="1920" data-height="1080">
        <canvas id="cv" width="1920" height="1080"></canvas>
        __CAPTIONS__
        <div id="lock">__LOCK__</div>
        <div id="warm">Meeting booked.</div>
      </div>
      <script>
        (function () {
          var T = __T__;
          var S = '[data-composition-id="dotfilm"] ';
          var cv = document.querySelector(S + "#cv"), g = cv.getContext("2d");
          var caps = Array.prototype.slice.call(document.querySelectorAll(S + ".cap")), lock = document.querySelector(S + "#lock");
          var W = 1920, H = 1080, P = 24, COLS = 80, ROWS = 45, N = COLS * ROWS;
          var BAR = 240 / T.bpm, BEAT = BAR / 4, END = T.bars * BAR;
          var A = {}; Object.keys(T.at).forEach(function (k) { A[k] = T.at[k] * BAR; });
          function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
          var C = {}; Object.keys(T.colors).forEach(function (k) { C[k] = rgb(T.colors[k]); });
          var WHITE = [255, 255, 255];

          function cl(u) { return Math.max(0, Math.min(1, u)); }
          function lerp(a, b, u) { return a + (b - a) * u; }
          function mix(p, q, u) { return [lerp(p[0], q[0], u), lerp(p[1], q[1], u), lerp(p[2], q[2], u)]; }
          function snap(u) { u = cl(u); return u >= 1 ? 1 : 1 - Math.pow(2, -10 * u); }            // expo out: the snap
          function pop(u) { u = cl(u); var v = u - 1; return Math.max(0, 1 + 2.7 * v * v * v + 1.7 * v * v); }  // back out: the pop
          function bump(t, t0, d) { var u = (t - t0) / d; return u < 0 || u > 1 ? 0 : Math.sin(Math.PI * u); }
          function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
          var SNAP = 0.18;
          // a position that holds, then snaps to each key on its time: keys [[t, x, y], ...]
          function hop(keys, t) {
            var k = -1; for (var i = 0; i < keys.length; i++) if (t >= keys[i][0]) k = i;
            if (k < 0) return [keys[0][1], keys[0][2]];
            if (k === 0) return [keys[0][1], keys[0][2]];
            var a = keys[k - 1], b = keys[k], u = snap((t - b[0]) / SNAP);
            return [lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
          }

          // the frame buffer: one intensity and colour per dot
          var I = new Float32Array(N), CR = new Float32Array(N), CG = new Float32Array(N), CB = new Float32Array(N);
          function put(i, v, c) { if (v > I[i]) { I[i] = v; CR[i] = c[0]; CG[i] = c[1]; CB[i] = c[2]; } }
          function cx(c) { return 12 + c * P; }
          function cy(r) { return 12 + r * P; }
          function area(x, y, R, fn) {
            var c0 = Math.max(0, Math.floor((x - R) / P)), c1 = Math.min(COLS - 1, Math.ceil((x + R) / P));
            var r0 = Math.max(0, Math.floor((y - R) / P)), r1 = Math.min(ROWS - 1, Math.ceil((y + R) / P));
            for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) fn(r * COLS + c, Math.hypot(cx(c) - x, cy(r) - y));
          }
          function bloom(p, R, amp, col) {
            if (amp <= 0 || R <= 0) return;
            area(p[0], p[1], R, function (i, d) { var u = 1 - d / R; if (u > 0) put(i, amp * Math.pow(u, 0.6), col); });
          }
          function ring(p, r, w, amp, col) {
            if (amp <= 0) return;
            area(p[0], p[1], r + w, function (i, d) { var u = 1 - Math.abs(d - r) / w; if (u > 0) put(i, amp * u, col); });
          }
          function ripple(t, t0, p, col, reach) {     // a ring of lit dots that snaps outward and fades
            var u = (t - t0) / 0.7; if (u < 0 || u > 1) return;
            ring(p, 50 + (reach || 520) * snap(u * 1.4), 26, 0.9 * (1 - u), col);
          }

          // ---- the cast
          var VIS = [960 - 240, 560], HOME = [1160, 540], MEET = [960, 540];
          var vKeys = [[0, -180, 560], [BEAT, 300, 580], [2 * BEAT, 540, 520], [3 * BEAT, VIS[0], VIS[1]],
                       [A.gone, 440, 600], [A.gone + BEAT, -240, 640],
                       [A.back, 240, 560], [A.back + BEAT, 520, 540], [A.back + 2 * BEAT, 740, 540], [A.booked, MEET[0] - 40, MEET[1]]];
          var SCAN = A.seen, SCAN_D = 0.45, FLIP = SCAN + SCAN_D * (VIS[0] + 60) / (W + 120);
          var B_RIP = [1, 3, 5, 7].map(function (b) { return A.engage + b * BEAT; });
          var V_RIP = [2, 4, 6, 7.5].map(function (b) { return A.engage + b * BEAT; });
          var R_POS = [1800, 150];
          var rKeys = [[A.rep + 0.25, R_POS[0], R_POS[1]], [A.rep + BEAT, 1420, 330], [A.rep + 2 * BEAT, 950, 320]];
          var TRIAD = A.rep + 3 * BEAT;
          var COMETS = [A.follow, A.follow + 1.5 * BEAT];

          // ---- the easter egg: Breakout plays Snake through the long wait, eating each signal
          // it moves on a coarse grid of 2x2 dots (cells K), like the old phone game
          var STEP = T.game.step * BAR, K = 2, SIG = T.game.signals.map(function (s) { return [Math.floor(s[0] / K), Math.floor(s[1] / K)]; });
          var cellX = Math.floor((HOME[0] - 12) / P / K), cellY = Math.floor((HOME[1] - 12) / P / K);
          var path = [[cellX - 3, cellY], [cellX - 2, cellY], [cellX - 1, cellY], [cellX, cellY]], PRE = path.length - 1;
          var eats = [];
          SIG.forEach(function (s, k) {
            var h = path[path.length - 1], x = h[0], y = h[1];
            function walkX() { while (x !== s[0]) { x += s[0] > x ? 1 : -1; path.push([x, y]); } }
            function walkY() { while (y !== s[1]) { y += s[1] > y ? 1 : -1; path.push([x, y]); } }
            walkX(); walkY();
            eats.push(path.length - 1 - PRE);
          });
          var lastStep = Math.floor((A.back - A.game) / STEP);
          (function () { var h = path[path.length - 1], x = h[0], y = h[1];                             // then it heads off, looking for more
            while (path.length - 1 - PRE < lastStep + 2) { y -= 1; path.push([x, y]); } })();
          function snakeStep(t) { return Math.max(0, Math.min(lastStep, Math.floor((t - A.game) / STEP))); }
          function eaten(n) { var e = 0; eats.forEach(function (s) { if (n >= s) e++; }); return e; }
          function kxy(c) { return [12 + (c[0] * K + 0.5) * P, 12 + (c[1] * K + 0.5) * P]; }
          function block(c, v, col) { for (var dy = 0; dy < K; dy++) for (var dx = 0; dx < K; dx++) { var x = c[0] * K + dx, y = c[1] * K + dy;
            if (x >= 0 && x < COLS && y >= 0 && y < ROWS) put(y * COLS + x, v, col); } }
          var HEAD_END_XY = kxy(path[PRE + lastStep]);
          var bKeys = [[A.engage, HOME[0], HOME[1]], [A.back + BEAT, HEAD_END_XY[0], HEAD_END_XY[1]], [A.back + 2 * BEAT, 1180, 540], [A.booked, MEET[0] + 40, MEET[1]]];

          // ---- words and logo, sampled onto the grid once the fonts are in
          var masks = {};
          function sample(draw) {
            var o = document.createElement("canvas"); o.width = W; o.height = H; var x = o.getContext("2d");
            draw(x); var d = x.getImageData(0, 0, W, H).data, out = [];
            for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
              var a = 0, cr = 0, cg = 0, cb = 0, n = 0;
              for (var yy = r * P + 2; yy < r * P + P; yy += 4) for (var xx = c * P + 2; xx < c * P + P; xx += 4) {
                var k = (yy * W + xx) * 4, al = d[k + 3] / 255; a += al; cr += d[k] * al; cg += d[k + 1] * al; cb += d[k + 2] * al; n++; }
              if (a / n > 0.06) out.push([r * COLS + c, Math.min(1, (a / n) * 1.25), [cr / a, cg / a, cb / a]]);
            }
            return out;
          }
          function getMask(name) {
            if (masks[name]) return masks[name];
            if (name === "booked") {
              if (document.fonts && !document.fonts.check('800 290px "Manrope"')) document.fonts.load('800 290px "Manrope"');
              masks.booked = sample(function (x) {
                x.font = '800 290px "Manrope", sans-serif'; x.textAlign = "center"; x.textBaseline = "middle";
                T.booked.forEach(function (l, i) { x.fillStyle = l[1] ? T.colors.visitor : "#ffffff"; x.fillText(l[0], 960, 380 + i * 300); });
              });
            } else {
              masks.logo = sample(function (x) {
                var vb = T.logo.vb, s = 1440 / vb[2];
                x.translate(960 - 720, 470 - vb[3] * s / 2); x.scale(s, s); x.translate(-vb[0], -vb[1]);
                T.logo.paths.forEach(function (p) { x.fillStyle = p[0]; x.fill(new Path2D(p[1])); });
              });
            }
            return masks[name];
          }

          // ---- the score in the corner: a tiny 3x5 dot font
          var FONT = { S: "111100111001111", C: "111100100100111", O: "111101101101111", R: "110101110101101", E: "111100111100111",
                       "0": "111101101101111", "1": "010110010010111", "2": "111001111100111", "3": "111001111001111", "4": "101101111001001", " ": "000000000000000" };
          function score(t, n, alpha) {
            var text = T.game.label + " " + ("000" + n).slice(-4), p = 7, x0 = W - 64 - (text.length * 4 - 1) * p, y0 = 56;
            for (var k = 0; k < text.length; k++) { var gl = FONT[text[k]] || FONT[" "];
              for (var j = 0; j < 15; j++) { var on = gl[j] === "1";
                g.fillStyle = on ? (k < T.game.label.length ? "rgba(190,121,255," + alpha + ")" : "rgba(255,255,255," + alpha + ")") : "rgba(60,54,84," + alpha * 0.5 + ")";
                g.beginPath(); g.arc(x0 + (k * 4 + (j % 3)) * p, y0 + Math.floor(j / 3) * p, on ? 2.6 : 1.2, 0, 7); g.fill(); } }
          }

          function frame(t) {
            I.fill(0);
            var dim = t < A.gone + 2 * BEAT ? 1 : t < A.back ? lerp(1, 0.4, snap((t - A.gone - 2 * BEAT) / 0.3)) : lerp(0.4, 1, snap((t - A.back) / 0.3));

            // the visitor: grey until the scan finds it, then pink
            var vp = hop(vKeys, t), vk = 0;
            V_RIP.forEach(function (r) { vk += bump(t, r, 0.28); });
            vp = [vp[0] + 28 * vk, vp[1]];
            var vcol = t < FLIP ? C.anon : C.visitor, vR = 100 * (1 + 0.4 * bump(t, FLIP, 0.3));
            if (t < A.booked + SNAP) bloom(vp, vR, 1, vcol);

            // the scan line
            if (t >= SCAN && t < SCAN + SCAN_D + 0.1) {
              var sx = lerp(-60, W + 60, cl((t - SCAN) / SCAN_D));
              for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) { var dx = Math.abs(cx(c) - sx); if (dx < 70) put(r * COLS + c, 0.75 * (1 - dx / 70), C.breakout); }
            }

            // Breakout: pops in, trades ripples, plays the game, comes back, merges
            var bp = hop(bKeys, t), bk = 0;
            B_RIP.forEach(function (r) { bk += bump(t, r, 0.28); });
            bp = [bp[0] - 28 * bk, bp[1]];
            var bAmp = 0, bR = 120;
            if (t >= A.engage && t < A.game) { bAmp = 1; bR = 120 * pop((t - A.engage) / 0.35); }
            if (t >= A.game && t < A.game + 0.15) { bAmp = 1; bR = 120 * (1 - (t - A.game) / 0.15); }
            if (t >= A.back + BEAT) { bAmp = 1; bR = 120 * pop((t - A.back - BEAT) / 0.35); }
            if (t < A.booked + SNAP) bloom(bp, bR, bAmp, C.breakout);
            B_RIP.forEach(function (r) { ripple(t, r, hop(bKeys, r), C.breakout); });
            V_RIP.forEach(function (r) { ripple(t, r, hop(vKeys, r), C.visitor, 420); });

            // the rep: a line shoots to the corner, a cyan bloom wakes and joins
            var lu = (t - A.rep) / 0.25;
            if (lu > 0 && t < A.rep + 0.7) {
              var head = snap(lu), tail = cl(lu - 0.6), fade = 1 - cl((t - A.rep - 0.45) / 0.25);
              for (var q = 0; q <= 40; q++) { var f = q / 40; if (f < tail || f > head) continue;
                var px = lerp(HOME[0], R_POS[0], f), py = lerp(HOME[1], R_POS[1], f);
                area(px, py, 14, function (i, d) { if (d < 14) put(i, 0.9 * fade, C.rep); }); }
            }
            if (t >= A.rep + 0.25 && t < A.gone + BEAT + 0.2) {
              var rR = 70 * pop((t - A.rep - 0.25) / 0.3) * (t > A.gone + BEAT ? 1 - cl((t - A.gone - BEAT) / 0.15) : 1);
              bloom(hop(rKeys, t), rR, 1, C.rep);
            }
            ripple(t, TRIAD, hop(rKeys, TRIAD), C.rep, 300);
            if (t >= TRIAD) { ripple(t, TRIAD, hop(vKeys, TRIAD), C.visitor, 300); ripple(t, TRIAD, hop(bKeys, TRIAD), C.breakout, 300); }

            // the follow-up: two comets after her, one straight, one zigzag
            COMETS.forEach(function (t0, k) {
              for (var j = 0; j < 22; j++) { var u = (t - t0 - j * 0.014) / 0.8; if (u < 0 || u > 1) continue;
                var e = snap(u * 1.1), x = lerp(HOME[0] - 100, -120, e), y = k === 0 ? lerp(HOME[1], 600, e) : HOME[1] + 120 * Math.sin(e * Math.PI * 4);
                bloom([x, y], 38, 1 - j / 22, k === 0 ? C.snake : C.breakout); }
              ripple(t, t0, HOME, C.breakout, 260);
            });

            // the easter egg
            var playing = t >= A.game && t < A.back + BEAT, n = snakeStep(t), got = 0;
            if (playing) {
              got = eaten(n);
              var len = 4 + 3 * got, born = cl((t - A.game) / 0.15);
              for (var j = 0; j < len; j++) { var cell = path[PRE + n - j]; if (cell) block(cell, born * (j === 0 ? 1 : 0.95 - 0.3 * j / len), j === 0 ? WHITE : C.snake); }
              if (got < eats.length) {                                   // the next signal blinks where it lands
                var s = SIG[got], appear = A.game + (got ? eats[got - 1] + 1 : 1) * STEP;
                if (t >= appear) { block(s, (Math.floor((t - appear) / (STEP / 2)) % 2) ? 0.5 : 1, C.signal);
                  ripple(t, appear, kxy(s), C.signal, 140); }
              }
              eats.forEach(function (e, k) { ripple(t, A.game + e * STEP, kxy(SIG[k]), C.snake, 220); });
            }

            // booked: the two snap together, a shockwave lights the grid, the dots spell it out
            if (t >= A.booked + SNAP && t < A.booked + 2 * BEAT) {
              var mu = (t - A.booked - SNAP) / 0.4;
              bloom(MEET, 170 * pop(mu) * (1 - cl((t - A.booked - 1.5 * BEAT) / 0.3)), 1, mix(WHITE, C.snake, cl(mu)));
            }
            var su = (t - A.booked - SNAP - 0.05) / 0.8;
            if (su > 0 && su < 1) { ring(MEET, 2300 * snap(su), 110, 1 - su, mix(C.visitor, C.breakout, su));
              for (var i2 = 0; i2 < N; i2++) put(i2, 0.3 * (1 - su), C.breakout); }
            if (t >= A.booked + 2 * BEAT && t < A.close + 0.45) {
              getMask("booked").forEach(function (m) { var on = A.booked + 2 * BEAT + rnd(m[0]) * 0.22, off = A.close + rnd(m[0] + 7) * 0.35;
                if (t >= on && t < off) put(m[0], m[1] * pop((t - on) / 0.2), m[2]); });
            }
            if (t >= A.close + BEAT) {
              getMask("logo").forEach(function (m) { var on = A.close + BEAT + (m[0] % COLS) / COLS * 0.4;
                if (t >= on) put(m[0], m[1] * pop((t - on) / 0.22), m[2]); });
            }

            // draw: the base grid pops on in a diagonal sweep at the start
            g.fillStyle = T.colors.ground; g.fillRect(0, 0, W, H);
            for (var r3 = 0; r3 < ROWS; r3++) for (var c3 = 0; c3 < COLS; c3++) {
              var idx = r3 * COLS + c3, v = I[idx], x3 = cx(c3), y3 = cy(r3);
              if (v < 0.03) {
                var on3 = (c3 + r3) * 0.0055; if (t < on3) continue;
                g.fillStyle = "rgba(" + C.dot.join(",") + "," + dim + ")";
                g.beginPath(); g.arc(x3, y3, 1.7 * pop((t - on3) / 0.2), 0, 7); g.fill(); continue;
              }
              var k3 = Math.min(1, v * 1.6);
              g.fillStyle = "rgb(" + Math.round(lerp(C.dot[0], CR[idx], k3)) + "," + Math.round(lerp(C.dot[1], CG[idx], k3)) + "," + Math.round(lerp(C.dot[2], CB[idx], k3)) + ")";
              g.beginPath(); g.arc(x3, y3, Math.max(0, 1.7 + 9.3 * v), 0, 7); g.fill();
            }
            if (t >= A.game && t < A.back + 2 * BEAT) {
              var blink = t < A.back || Math.floor((t - A.back) / (BEAT / 2)) % 2 === 0;
              score(t, eaten(snakeStep(t)), cl((t - A.game) / 0.15) * (blink ? 1 : 0.15));
            }

            // captions cut in and out on downbeats, with a small snap up
            T.caps.forEach(function (cp, k) { var a = cp[0] * BAR, b = cp[1] * BAR, el = caps[k];
              if (t >= a && t < b) { el.style.display = "flex"; el.style.transform = "translateY(" + (10 * (1 - snap((t - a) / 0.16))).toFixed(2) + "px)"; }
              else el.style.display = "none"; });
            var lt = A.close + 3 * BEAT;
            lock.style.display = t >= lt ? "block" : "none";
            lock.style.transform = "translateY(" + (14 * (1 - snap((t - lt) / 0.2))).toFixed(2) + "px)";
          }

          var drv = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(drv, { t: 0.001 }, { t: END, duration: END - 0.001, ease: "none", onUpdate: function () { frame(drv.t); }, immediateRender: false }, 0.001);
          // no draw at load: the runtime seeks the timeline for every frame, and DOM writes before it is ready throw
          window.__timelines["dotfilm"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
