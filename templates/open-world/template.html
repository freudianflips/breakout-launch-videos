              var cA2 = new THREE.Color("#4c00ff"), cB2 = new THREE.Color("#7a7a80"); mcol = "#" + cA2.lerp(cB2, 1 - fill).getHexString(); meterName.textContent = T.missions[0].meter; }

            if (t >= A.close) { scl = lerp(0.9, 0.16, eio((t - A.close) / (2 * BEAT))); CLOSE_BLIPS.forEach(function (r, i) { if (t >= A.close + i * BEAT / 2) blips.push({ x: r[0], z: r[2], color: "#be79ff", square: true, size: 7 }); }); }
            radar(t, sh, focus, hy, blips, scl, rOp);

            // words: help box, title, objective, mission passed, labels
            var M = T.missions;
            show(HELP[0], !lbOn && t >= 1.25 * BAR + BEAT / 2 && t < A.m1_start + 2 * BEAT, 1.25 * BAR + BEAT / 2, t, "rise");
            show(TITLE[0], t >= A.m1_title + 1.5 * BEAT && t < A.m1_start - BEAT / 2, A.m1_title + 1.5 * BEAT, t, "fade");
            show(OBJ[0], t >= A.m1_start + BEAT && t < A.ride + 2 * BEAT, A.m1_start + BEAT, t, "rise");
            show(PASS[0], t >= A.m1_pass + 2 * BEAT && t < A.m2_title - BEAT / 2, A.m1_pass + 2 * BEAT, t, "slam");

          var drv = { t: 0 };
