      <script>
        (function () {
          var S = '[data-composition-id="plays"] ';
          function one(s) { return document.querySelector(S + s); }
          function all(s) { return Array.prototype.slice.call(document.querySelectorAll(S + s)); }
          function cl(u) { return Math.max(0, Math.min(1, u)); }
          function out3(u) { u = cl(u); return 1 - Math.pow(1 - u, 3); }
          function out4(u) { u = cl(u); return 1 - Math.pow(1 - u, 4); }
          function io(u) { u = cl(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
          function mix(a, b, u) { return a + (b - a) * u; }
          function hash(a, b) { var h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return Math.abs(h ^ (h >>> 16)); }
          function rnd(a, b) { return (hash(a, b) % 10000) / 10000; }
          function blur(v) { return v > 0.05 ? "blur(" + v.toFixed(2) + "px)" : "none"; }
          var T = __T__;
          var BAR = 240 / T.bpm, BEAT = BAR / 4, END = T.bars * BAR;
          function B(x) { return x * BAR; }

          // ---------------------------------------------------------------- shared geometry
          function hexPath(cx, cy, r) {
            var d = "";
            for (var i = 0; i < 6; i++) { var a = Math.PI / 3 * i + Math.PI / 6; d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1); }
            return d + "Z";
          }
          function combPath(x0, y0, cols, rows, r) {
            var d = "", w = Math.sqrt(3) * r;
            for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) d += hexPath(x0 + i * w + (j % 2) * w / 2, y0 + j * 1.5 * r, r);
            return d;
          }
          // the engraved comb in the paper's margins
          one("#comb").setAttribute("d", combPath(-30, 760, 6, 6, 44) + combPath(1650, -20, 6, 5, 44));

          // the waggle dance: a straight waggle run up the middle, a return loop right, the run again, a loop left
          var DC = { x: 900, y: 690 }, RUN = 360;
          function waggle(x, y0, y1, n, amp) { var d = ""; for (var i = 0; i <= n; i++) { var u = i / n; d += "L" + (x + (i % 2 ? amp : -amp) * (i && i < n ? 1 : 0)).toFixed(1) + "," + mix(y0, y1, u).toFixed(1); } return d; }
          var y0 = DC.y + RUN / 2, y1 = DC.y - RUN / 2;
          var dance = "M" + DC.x + "," + y0 + waggle(DC.x, y0, y1, 16, 16).slice(0) +
            " C" + (DC.x + 420) + "," + (y1 - 60) + " " + (DC.x + 420) + "," + (y0 + 60) + " " + DC.x + "," + y0 +
            waggle(DC.x, y0, y1, 16, 16) +
            " C" + (DC.x - 420) + "," + (y1 - 60) + " " + (DC.x - 420) + "," + (y0 + 60) + " " + DC.x + "," + y0;
          var dp = one("#dancep"); dp.setAttribute("d", dance.replace(/^M([^L]+)L/, "M$1L"));
          var DL = dp.getTotalLength(); dp.style.strokeDasharray = DL; dp.style.strokeDashoffset = DL;
          // candidate sites around the plate; the chosen one up and to the right of the run's bearing
          var SITES = [[1500, 820], [330, 460], [300, 880], [1260, 980], [620, 330]], CHOSEN = [1520, 400];
          var sg = one("#sites"), sh = "";
          SITES.forEach(function (p) { sh += '<path class="ink" stroke-width="2.5" opacity="0.55" d="' + hexPath(p[0], p[1], 34) + '"/>'; });
          sh += '<path class="ink" id="chosen" stroke-width="3.5" d="' + hexPath(CHOSEN[0], CHOSEN[1], 46) + '"/>';
          sg.innerHTML = sh;
          one("#bearing").setAttribute("d", "M" + DC.x + "," + (DC.y - RUN / 2 - 20) + "L" + (CHOSEN[0] - 40) + "," + (CHOSEN[1] + 20));
          // the quorum: a big cavity and 15 scouts flying in
          var CAV = { x: 860, y: 660, r: 260 };
          one("#cavity").setAttribute("d", hexPath(CAV.x, CAV.y, CAV.r));
          var SC = [], scg = one("#scouts"), sch = "";
          for (var i = 0; i < 15; i++) {
            var ang = rnd(i, 3) * Math.PI * 2, rr = rnd(i, 5) * 150;
            SC.push({ fx: CAV.x + Math.cos(ang) * 1300, fy: CAV.y + Math.sin(ang) * 900, x: CAV.x + Math.cos(ang) * rr, y: CAV.y + Math.sin(ang) * rr * 0.9, g: i % 3 });
            sch += '<circle r="11" fill="#2a1d14" opacity="0"/>';
          }
          scg.innerHTML = sch;
          var scouts = Array.prototype.slice.call(scg.children);
          var GROUP = [[CAV.x - 120, CAV.y + 40], [CAV.x, CAV.y - 90], [CAV.x + 120, CAV.y + 40]];

          // grain: 1 seeded noise tile, shifted every 1/24 s
          var gc = document.createElement("canvas"); gc.width = gc.height = 384;
          var gg = gc.getContext("2d"), gi = gg.createImageData(384, 384), sd = 1337;
          for (var q = 0; q < gi.data.length; q += 4) { sd = (sd * 16807) % 2147483647; var gv = 40 + (sd % 176); gi.data[q] = gi.data[q + 1] = gi.data[q + 2] = gv; gi.data[q + 3] = 255; }
          gg.putImageData(gi, 0, 0);
          var grain = one("#grain"); grain.style.backgroundImage = "url(" + gc.toDataURL() + ")";

          // fit a row of words into the frame once
          function fit(el, max) { var k = el.children; if (!k.length) return; var w = k[k.length - 1].offsetLeft + k[k.length - 1].offsetWidth - k[0].offsetLeft;
            if (w > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w).toFixed(1) + "px"; }
          all(".prow, .cap .row, .big, #lockup .line").forEach(function (el) { fit(el, 1640); });

          // ---------------------------------------------------------------- words
          // a word lands: rises, sharpens; a key word also wobbles (a skew that rings out)
          function word(el, t, at, key) {
            var u = (t - at) / 0.34;
            if (u <= 0) { el.style.opacity = 0; return; }
            var e = out4(u), wob = key ? Math.sin((t - at) * 26) * 9 * Math.exp(-(t - at) * 4.5) : 0;
            el.style.opacity = cl(u * 1.6);
            el.style.transform = "translateY(" + ((1 - e) * 26).toFixed(1) + "px) skewX(" + wob.toFixed(2) + "deg)";
            el.style.filter = blur((1 - e) * 8);
          }
          function rowWords(row, t, from, to, lag) {
            var vis = t >= from && t < to + 0.25;
            if (!vis) { row.style.opacity = 0; return; }
            var fade = 1 - cl((t - to) / 0.18);
            row.style.opacity = fade;
            Array.prototype.forEach.call(row.children, function (w) { word(w, t - (lag || 0), +w.dataset.at, w.classList.contains("k")); });
          }
          var prows = all(".prow");
          var caps = all(".cap");
          var ticks = all(".tick");

          // ---------------------------------------------------------------- the liquid
          var blobs = all(".blob");
          var BL = [[900, 420, 360, 0.11, 0.08, 0.0], [380, 760, 300, 0.09, 0.13, 1.9], [1560, 860, 280, 0.13, 0.07, 3.3], [200, 120, 260, 0.06, 0.09, 4.4], [1700, 80, 300, 0.08, 0.05, 2.6]];
          function liquid(t) {
            // it slows to a near stop in the last 3 bars
            var tt = t < B(17) ? t : B(17) + (1 - Math.exp(-(t - B(17)) / 2.2)) * 2.2;
            blobs.forEach(function (b, i) {
              var p = BL[i], w = parseFloat(b.style.width);
              var x = p[0] + Math.sin(tt * p[3] * 2 * Math.PI + p[5]) * p[2], y = p[1] + Math.cos(tt * p[4] * 2 * Math.PI + p[5] * 1.3) * p[2] * 0.7;
              b.style.transform = "translate(" + (x - w / 2).toFixed(1) + "px," + (y - w / 2).toFixed(1) + "px) scale(" + (1 + 0.12 * Math.sin(tt * 0.7 + i)).toFixed(3) + ")";
            });
            one("#swirl").style.transform = "rotate(" + (tt * 9).toFixed(2) + "deg) scale(" + (1 + 0.05 * Math.sin(tt * 0.5)).toFixed(3) + ")";
            one("#bands").style.transform = "scale(" + (1 + 0.18 * Math.sin(tt * 0.9)).toFixed(3) + ") rotate(" + (-tt * 4).toFixed(2) + "deg)";
            var hue = Math.sin(tt * 0.35) * 16 + (t > B(12) && t < B(16) ? Math.sin((t - B(12)) * 1.6) * 22 : 0);
            one("#liquid").style.filter = "hue-rotate(" + hue.toFixed(1) + "deg) saturate(1.15)";
          }

          // ---------------------------------------------------------------- product shots
          var FW = 1500, FH = 735, FX = 210, FY = 262;
          var SHOTS = {
            new:   { from: 8, to: 9, keys: [[8, [0, 0, 2000, 980]], [8.2, [0, 0, 2000, 980]], [8.6, [1000, 205, 590, 260]], [9, [1020, 215, 550, 240]]] },
            aud1:  { from: 9, to: 10, keys: [[9, [1530, 170, 450, 240]], [9.68, [1530, 175, 450, 240]], [9.95, [300, 88, 1160, 200]], [10, [300, 88, 1160, 200]]] },
            filt:  { from: 10, to: 11, keys: [[10, [300, 88, 1160, 200]], [10.3, [300, 88, 1160, 200]], [10.6, [330, 360, 1080, 120]], [11, [700, 370, 560, 90]]] },
