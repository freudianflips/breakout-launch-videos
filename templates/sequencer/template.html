      <script>
        (function () {
          var S = '[data-composition-id="press"] ';
          function one(s) { return document.querySelector(S + s); }
          function all(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll((el ? "" : S) + s)); }
          function cl(u) { return Math.max(0, Math.min(1, u)); }
          function out4(u) { u = cl(u); return 1 - Math.pow(1 - u, 4); }
          function in3(u) { u = cl(u); return u * u * u; }
          function io(u) { u = cl(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
          function lerp(a, b, u) { return a + (b - a) * u; }
          var T = __T__;
          var BAR = 240 / T.bpm, S16 = BAR / 16, END = T.bars * BAR, TR = T.transport;
          function B(x) { return x * BAR; }
          function inb(t, a) { return (t - B(a)) / BAR; }          // bars since bar a
          var ROWY = [480, 600, 720, 840];
          function stepX(k) { return 752 + k * 60 + Math.floor(k / 4) * 16; }

          // the last time step k was hit by the playhead, at or before t
          function lastHit(k, t) { var n = Math.floor((t / S16 - k) / 16); return (n * 16 + k) * S16; }
          function fire(k, t, a, b, muteAt) {
            var th = lastHit(k, t);
            if (th < B(a) - 1e-6 || th >= B(b) - 1e-6 || (muteAt != null && th >= B(muteAt) - 1e-6)) return 0;
            return Math.exp(-(t - th) / 0.11);
          }
          function firstHitAfter(steps, t) {     // the first hit of a row's steps at or after t
            var best = 1e9;
            steps.forEach(function (k) { var th = lastHit(k, t); if (th < t - 1e-6) th += BAR; if (th < best) best = th; });
            return best;
          }

          var root = one("#root");
          var rows = all(".row"), rowCells = rows.map(function (r) { return all(".c", r); });
          var rowChars = rows.map(function (r) { return all(".ch", r); });
          var minis = all(".mrow"), miniDots = minis.map(function (m) { return all(".d", m); });
          var words = all("#email .w"), phs = all("#email .ph");
          var chips = all(".chip"), elabs = all(".el"), faces = all(".face"), lcells = all("#lstrip .c");
          var plChars = all("#playline .ch");
          var cv = one("#many"), g = cv.getContext("2d");
          var drv = { t: 0 };
          function hash(a, b, c) { var h = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return h - Math.floor(h); }

          function slam(el, t, a, b, dy) {        // a word that slams in on bar a and leaves on bar b
            var u = inb(t, a), v = b == null ? -1 : inb(t, b);
            var on = u >= 0 && (b == null || v < 0.08);
            el.style.opacity = on ? (cl(u / 0.03) * (b == null ? 1 : 1 - cl(v / 0.08))).toFixed(3) : 0;
            var sc = 1.12 - 0.12 * out4(u / 0.1);
            el.style.transform = "translateY(" + ((b != null && v > 0 ? -60 * out4(v / 0.08) : 0) + (dy || 0)).toFixed(1) + "px) scale(" + sc.toFixed(4) + ")";
          }

          function drawMany(t, s, tx, ty, alpha) {
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.clearRect(0, 0, 1920, 1080);
            if (alpha <= 0.001) return;
            g.globalAlpha = alpha;
            g.setTransform(s, 0, 0, s, tx, ty);
            var BW = 1700, x0 = (0 - tx) / s, x1 = (1920 - tx) / s, y0 = (0 - ty) / s, y1 = (1080 - ty) / s;
            var cur = Math.floor(t / S16) % 16;
            var j0 = Math.floor((x0 - 160) / BW) - 1, j1 = Math.ceil((x1 - 160) / BW) + 1;
            var i0 = Math.floor((y0 - 480) / 120) - 1, i1 = Math.ceil((y1 - 480) / 120) + 1;
            for (var j = j0; j <= j1; j++) {
              var bx = j * BW;
              for (var i = i0; i <= i1; i++) {
                if (j === 0 && i >= 0 && i <= 3) continue;
                var y = 480 + i * 120;
                g.fillStyle = "rgba(4,4,5,0.22)";
                g.fillRect(bx + 216, y + 52, 90 + hash(i, j, 9) * 240, 16);
                for (var k = 0; k < 16; k++) {
                  var lit = hash(i, j, k) < 0.19, x = bx + stepX(k);
                  if (lit) { var f = k === cur ? 1 : 0; g.fillStyle = "rgba(76,0,255," + (0.45 + 0.55 * f) + ")"; }
                  else g.fillStyle = k === cur ? "rgba(76,0,255,0.12)" : "rgba(4,4,5,0.07)";
                  g.fillRect(x, y + 20, 46, 80);
                }
              }
              g.fillStyle = "#4c00ff";
              var px = bx + stepX(cur) + ((t / S16) % 1) * 60;
              g.fillRect(px, y0, 3 / s, y1 - y0);
            }
            g.globalAlpha = 1;
          }

          function render() {
            var t = drv.t, i, k;
            var bar = t / BAR;

            // ---- chrome
            var idx = bar < TR.stop ? ["01", "Signal"] : bar < TR.drop ? ["02", "Play"] : bar < 10 ? ["03", "Email"] : ["04", "Send"];
            one("#idxn").textContent = idx[0]; one("#idxw").textContent = idx[1];
            one("#idx").style.opacity = bar < TR.lockup ? 1 : 0;
            one("#brandtag").style.opacity = bar < TR.lockup ? 1 : 0;
            one("#disc").style.opacity = (cl(inb(t, 2) / 0.1) * (1 - cl(inb(t, TR.booked) / 0.05))).toFixed(3);
            var bn = Math.floor(bar) + 1, bt = Math.floor((bar % 1) * 4) + 1;
            one("#tc").textContent = T.bpm + " BPM · " + (bn < 10 ? "0" : "") + bn + "." + bt;
            one("#tc").style.opacity = bar < TR.lockup ? 1 : 0;

            // ---- the camera: a pull back to 700+ in bar 5, a slow push in bar 6
            var s = 1;
            var zu = inb(t, TR.zoom);
            if (zu >= 0 && zu < 1) {
              s = zu < 0.85 ? lerp(1, 0.1, io(zu / 0.55)) * (1 - 0.15 * cl((zu - 0.55) / 0.3)) : lerp(0.085, 1, io((zu - 0.85) / 0.15));
            } else if (bar >= TR.stop && bar < TR.press) s = 1 + 0.04 * io(inb(t, TR.stop));
            var cx = 960, cy = 720, tx = cx * (1 - s), ty = cy * (1 - s);
            one("#cam").style.transform = "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
            drawMany(t, s, tx, ty, zu >= 0 && zu < 1 ? cl((1 - s) / 0.25) : 0);
            var camOp = bar < TR.press ? 1 : bar < TR.drop ? 1 - 0.9 * cl(inb(t, TR.press) / 0.1) : 0;
            one("#cam").style.opacity = camOp.toFixed(3);

            // ---- the rows
            var running = bar < TR.stop;
            rows.forEach(function (row, r) {
              var R = T.rows[r], st = R.start, ghost = R.mute_at != null;
              var y = ROWY[r];
              if (bar >= TR.stop) y += 60 * io(inb(t, TR.stop) / 0.2);
              var rop = 1;
              if (ghost) rop = bar < st ? 1 : bar >= TR.stop ? 1 - cl(inb(t, TR.stop) / 0.1) : 0.6;
              row.style.transform = "translateY(" + y.toFixed(1) + "px)";
              row.style.opacity = rop.toFixed(3);
              var chs = rowChars[r], n = chs.length;
              chs.forEach(function (c, j) { c.style.opacity = t >= B(st) + j * (0.2 * BAR / n) ? 1 : 0; });
              one("[data-r='" + r + "'] .mbtn").style.opacity = bar >= st ? 1 : 0;
              var muted = ghost && bar >= R.mute_at;
              one("[data-r='" + r + "'] .mbtn").className = "mbtn" + (muted ? " on" : "");
              var tg = one("[data-r='" + r + "'] .tag"), ta = ghost ? R.mute_at : R.tag_at, tu = inb(t, ta);
              tg.style.opacity = tu >= 0 ? cl(tu / 0.03) : 0;
              tg.style.transform = "scale(" + (tu >= 0 ? 1.25 - 0.25 * out4(tu / 0.08) : 1).toFixed(3) + ")";
              var cur = Math.floor(t / S16) % 16;
              rowCells[r].forEach(function (c, kk) {
                var lit = R.steps.indexOf(kk) >= 0 && t >= B(st) + kk * S16 - 1e-6;
                var f = lit ? fire(kk, t, st, TR.stop, ghost ? R.mute_at : null) : 0;
                var under = running && kk === cur;
                if (lit) c.style.background = muted ? "#d3d1cc" : ghost ? "rgba(76,0,255,0.38)" : "#4c00ff";
                else c.style.background = under ? "rgba(76,0,255,0.07)" : "transparent";
                c.style.transform = "scaleY(" + (1 + 0.16 * f).toFixed(3) + ")";
                c.style.boxShadow = lit && f > 0.02 ? "0 0 0 " + (6 * f).toFixed(1) + "px rgba(76,0,255," + (0.22 * f).toFixed(3) + ")" : (lit ? "none" : "inset 0 0 0 1.5px rgba(4,4,5,0.14)");
              });
            });
            var phPos = (t / S16) % 16, pk = Math.floor(phPos);
            one("#ph").style.transform = "translateX(" + (stepX(pk) + (phPos - pk) * 60 - 8).toFixed(1) + "px)";
            one("#ph").style.opacity = running ? 1 : 1 - cl(inb(t, TR.stop) / 0.05);

            // ---- 01: Listen.
            slam(one("#w-listen"), t, 1, 2);

            // ---- 700+
            var cu = inb(t, TR.zoom);
            var cn = one("#counter");
            cn.style.opacity = cu >= 0.15 && cu < 0.95 ? (cl((cu - 0.15) / 0.05) * (1 - cl((cu - 0.85) / 0.08))).toFixed(3) : 0;
            cn.style.transform = "translateY(" + ((1 - out4((cu - 0.15) / 0.12)) * 30).toFixed(1) + "px)";
            var cv2 = Math.round(T.counter.to * out4((cu - 0.15) / 0.45));
            one("#cnum").textContent = cv2 + (cu >= 0.6 ? T.counter.suffix : "");

            // ---- 02: the play line types in bar 6
            var pu = inb(t, TR.stop);
            plChars.forEach(function (c, j) { c.style.opacity = pu >= 0.05 + j * (0.5 / plChars.length) && bar < TR.drop ? 1 : 0; });
            one("#playline").style.opacity = bar < TR.press ? 1 : 1 - 0.9 * cl(inb(t, TR.press) / 0.1);

            // ---- Press play.
            var pb = one("#pbtn"), bu = inb(t, TR.press), du = inb(t, TR.drop);
            var bx = 225, by = 410, bw = 260, bh = 260, br = 44, bsc = 1, bop = 0;
            if (bu >= 0 && du < 0.35) {
              bop = cl(bu / 0.03);
              bsc = 1.2 - 0.2 * out4(bu / 0.1);
              var press = inb(t, TR.press + 0.75);
              if (press >= 0 && du < 0) bsc *= 1 - 0.08 * Math.exp(-press / 0.06) - 0.04;
              if (du >= 0) {                                   // the button opens into the email
                var em = one("#email"), mu = out4(du / 0.22);
                bx = lerp(225, 960, mu); by = lerp(410, 190, mu); bw = lerp(260, 800, mu); bh = lerp(260, em.offsetHeight, mu); br = lerp(44, 20, mu);
                bsc = 1; bop = 1 - cl((du - 0.2) / 0.12);
              }
            }
            pb.style.left = bx.toFixed(1) + "px"; pb.style.top = by.toFixed(1) + "px"; pb.style.width = bw.toFixed(1) + "px"; pb.style.height = bh.toFixed(1) + "px";
            pb.style.borderRadius = br.toFixed(1) + "px"; pb.style.opacity = bop.toFixed(3); pb.style.transform = "scale(" + bsc.toFixed(4) + ")";
            one("#pbtn svg").style.opacity = du >= 0 ? 1 - cl(du / 0.06) : 1;
            slam(one("#w-press"), t, TR.press, TR.drop);
            var cur2 = one("#cur"), ku = inb(t, TR.press + 0.45);
            if (ku >= 0 && du < 0.1) {
              var m = io(ku / 0.22);
              cur2.style.opacity = cl(ku / 0.05) * (1 - cl(du / 0.08));
              cur2.style.transform = "translate(" + lerp(1320, 350, m).toFixed(1) + "px," + lerp(1000, 540, m).toFixed(1) + "px)" +
                (inb(t, TR.press + 0.75) >= 0 ? " scale(0.88)" : "");
            } else cur2.style.opacity = 0;

            // ---- 03: the drop. The email writes itself on the beat; the play's rows keep playing on the left
            var email = one("#email");
            email.style.opacity = du >= 0.16 && bar < TR.booked ? cl((du - 0.16) / 0.08) : 0;
            var sw = inb(t, TR.send);
            email.style.transform = "translateX(" + (sw > 0 ? 1300 * in3(sw / 0.14) : 0).toFixed(1) + "px)";
            var wstart = TR.drop + 0.25;
            words.forEach(function (w, j) {
              var wu = inb(t, wstart + j / 16);
              w.style.opacity = wu >= 0 ? 1 : 0;
              w.style.transform = "translateY(" + (wu >= 0 ? 8 * (1 - out4(wu / 0.04)) : 8).toFixed(1) + "px)";
            });
            var MY = [560, 420, 700, 280];      // committee on top, then New CFO, Pricing page, Return visit: no wire crosses another
            var wiresHtml = "";
            var rootR = root.getBoundingClientRect(), sc = rootR.width / 1920 || 1;
            function local(el) { var q = el.getBoundingClientRect(); return { x: (q.left - rootR.left) / sc, y: (q.top - rootR.top) / sc, w: q.width / sc, h: q.height / sc }; }
            function wire(r, el, tw) {
              var wu2 = (t - tw) / (0.12 * BAR);
              if (wu2 < 0) return;
              var x0 = 160 + 508 + 18, y0 = MY[r] + 40 + 11, q = local(el), x1 = local(one("#email")).x - 8, y1 = q.y + q.h / 2;
              var dx = (x1 - x0) * 0.5, d = "M" + x0 + " " + y0 + " C" + (x0 + dx) + " " + y0 + " " + (x1 - dx) + " " + y1 + " " + x1 + " " + y1;
              var L = Math.hypot(x1 - x0, y1 - y0) * 1.25;
              wiresHtml += '<path d="' + d + '" stroke-dasharray="' + L.toFixed(0) + '" stroke-dashoffset="' + (L * (1 - out4(wu2))).toFixed(1) + '"/>' +
                '<circle cx="' + x0 + '" cy="' + y0 + '" r="6"/>' + (wu2 > 0.9 ? '<circle cx="' + x1 + '" cy="' + y1 + '" r="6"/>' : "");
            }
            phs.forEach(function (ph) {
              var key = ph.getAttribute("data-ph"), r = T.links[key];
              var ws = all(".w", ph), last = words.indexOf(ws[ws.length - 1]);
              var done = B(wstart + (last + 1) / 16);
              var R = T.rows[r], tw = firstHitAfter(R.steps, done);
              ph.className = "ph" + (t >= tw && bar < TR.send ? " on" : "");
              if (bar < TR.send) wire(r, ws[0], tw);
            });
            // the committee: a chip on each note of the chord, wired to the To field
            var CM = T.committee;
            chips.forEach(function (c, j) {
              var cu3 = (t - B(CM.start) - CM.steps[j] * S16) / BAR;
              c.style.opacity = cu3 >= 0 ? 1 : 0;
              c.style.transform = "scale(" + (cu3 >= 0 ? 1.2 - 0.2 * out4(cu3 / 0.06) : 1).toFixed(3) + ")";
            });
            one("#to1").style.opacity = bar < CM.start ? 1 : 0;
            if (bar < TR.send) wire(3, one("#chips"), B(CM.start));
            one("#wires").innerHTML = wiresHtml;
            one("#wires").style.opacity = bar < TR.send ? 1 : 0;
            elabs.forEach(function (e, j) { var eu = inb(t, 9.5 + j * 0.125); e.style.opacity = eu >= 0 && bar < TR.send ? 1 : 0; });

            minis.forEach(function (mr, j) {
              var isCm = j === 3, ma = isCm ? CM.start : TR.drop + j * 0.05;
              var mu2 = inb(t, ma);
              mr.style.top = MY[j] + "px";
              mr.style.opacity = mu2 >= 0 ? (cl(mu2 / 0.04) * (1 - cl(sw / 0.1))).toFixed(3) : 0;
              mr.style.transform = "translateX(" + ((mu2 >= 0 ? -30 * (1 - out4(mu2 / 0.1)) : 0) - (sw > 0 ? 300 * in3(sw / 0.14) : 0)).toFixed(1) + "px)";
              var steps = isCm ? CM.steps : T.rows[j].steps, a = isCm ? CM.start : TR.drop;
              miniDots[j].forEach(function (d, kk) {
                var lit = steps.indexOf(kk) >= 0 && (!isCm || t >= B(a) + kk * S16 - 1e-6);
                var f = lit ? fire(kk, t, a, TR.send) : 0;
                var under = bar >= TR.drop && bar < TR.send && kk === Math.floor(t / S16) % 16;
                d.style.background = lit ? "#4c00ff" : under ? "rgba(76,0,255,0.12)" : "transparent";
                d.style.boxShadow = lit ? (f > 0.02 ? "0 0 0 " + (5 * f).toFixed(1) + "px rgba(76,0,255," + (0.25 * f).toFixed(3) + ")" : "none") : "inset 0 0 0 1.5px rgba(4,4,5,0.16)";
                d.style.transform = "scale(" + (1 + 0.3 * f).toFixed(3) + ")";
              });
            });

            // ---- 04: Sent., then the ▶ is left alone
            slam(one("#w-sent"), t, TR.send, TR.booked);
            one("#w-sent").style.opacity = bar >= TR.booked ? 0 : one("#w-sent").style.opacity;

            // ---- 05: violet floods out of the ▶; the ▶ redraws itself as a ✓
            var fu = inb(t, TR.booked), lu = inb(t, TR.lockup);
            var pd = one("#pdot"), pdu = inb(t, TR.send + 0.08);
            var lchip = one("#lchip"), lq = local(lchip);
            var pcx = 960, pcy = 540, psz = 140, fr = 0, fcx = 960, fcy = 540;
            if (fu >= 0) { var mm = io(fu / 0.3); pcx = lerp(960, 1580, mm); pcy = lerp(540, 450, mm); psz = lerp(140, 400, mm); fr = 2300 * out4(fu / 0.2); }
            if (lu >= 0) { var rr = io(lu / 0.25); fr = lerp(2300, 52, rr); fcx = lerp(960, lq.x + lq.w / 2, rr); fcy = lerp(540, lq.y + lq.h / 2, rr); }
            one("#flood").style.clipPath = "circle(" + fr.toFixed(1) + "px at " + fcx.toFixed(1) + "px " + fcy.toFixed(1) + "px)";
            one("#flood").style.opacity = lu >= 0.25 ? 0 : 1;
            pd.style.opacity = pdu >= 0 && lu < 0.06 ? (cl(pdu / 0.03) * (1 - cl(lu / 0.06))).toFixed(3) : 0;
            pd.style.transform = "translate(" + (pcx - 50).toFixed(1) + "px," + (pcy - 50).toFixed(1) + "px) scale(" + ((psz / 100) * (pdu >= 0 ? 1.3 - 0.3 * out4(pdu / 0.08) : 1)).toFixed(4) + ")";
            var pc = one("#pc"), ring = cl(fu / 0.15);
            pc.setAttribute("fill", fu >= 0.12 ? "none" : "#4c00ff");
            pc.setAttribute("stroke", "#fff"); pc.setAttribute("stroke-width", (2.2 * ring).toFixed(2));
            one("#ptri").style.opacity = (1 - cl(fu / 0.1)).toFixed(3);
            var tk = one("#ptick"), tku = cl((fu - 0.12) / 0.2);
            tk.setAttribute("stroke-dasharray", "70"); tk.setAttribute("stroke-dashoffset", (70 * (1 - out4(tku))).toFixed(1));
            tk.setAttribute("stroke-width", (4.5 / Math.max(0.5, psz / 140) * 1.9).toFixed(2));
            var bok = one("#bigok"), card = one("#c-bd"), out1 = 1 - cl(lu / 0.06);
            var ou = inb(t, TR.booked + 0.08);
            bok.style.opacity = ou >= 0 ? (cl(ou / 0.04) * out1).toFixed(3) : 0;
            bok.style.transform = "translateY(" + (ou >= 0 ? 40 * (1 - out4(ou / 0.12)) : 40).toFixed(1) + "px)";
            var cu4 = inb(t, TR.booked + 0.2);
            card.style.opacity = cu4 >= 0 ? (cl(cu4 / 0.05) * out1).toFixed(3) : 0;
            card.style.transform = "translateY(" + (cu4 >= 0 ? 50 * (1 - out4(cu4 / 0.14)) : 50).toFixed(1) + "px)";
            faces.forEach(function (f2, j) {
              var fu2 = inb(t, TR.booked + 0.35 + j * 0.06);
              f2.style.opacity = fu2 >= 0 ? 1 : 0;
              f2.style.transform = "scale(" + (fu2 >= 0 ? 1.3 - 0.3 * out4(fu2 / 0.06) : 1).toFixed(3) + ")";
            });

            // ---- lockup: the flood draws back into the ▶ beside Plays; 1 row keeps ticking, then stops
            var lp = one("#lplay");
            lp.style.opacity = lu >= 0.22 ? cl((lu - 0.22) / 0.04) : 0;
            one("#llogo").style.opacity = lu >= 0.3 ? cl((lu - 0.3) / 0.06) : 0;
            one("#llogo").style.transform = "translateX(-50%) translateY(" + (lu >= 0.3 ? 16 * (1 - out4((lu - 0.3) / 0.15)) : 16).toFixed(1) + "px)";
            one("#lurl").style.opacity = lu >= 0.45 ? cl((lu - 0.45) / 0.06) : 0;
            one("#lstrip").style.opacity = lu >= 0.55 ? cl((lu - 0.55) / 0.06) : 0;
            var lrun = bar < TR.end, lstep = lrun ? Math.floor(t / S16) % 16 : 0;
            lcells.forEach(function (c, kk) {
              var on = lu >= 0.55 && kk === lstep;
              c.style.background = on ? "#4c00ff" : "transparent";
              c.style.boxShadow = on ? "none" : "inset 0 0 0 1.5px rgba(4,4,5,0.18)";
            });
          }
          function safe() { try { render(); } catch (e) { var er = one("#err"); er.style.display = "block"; er.textContent = e.stack || String(e); } }
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(drv, { t: 0.001 }, { t: END, duration: END - 0.001, ease: "none", onUpdate: safe, immediateRender: false }, 0.001);
          safe();
          window.__timelines["press"] = tl;
        })();
      </script>
    </template>
  </body>
