      <script>
        (function () {
          var S = '[data-composition-id="signal"] ';
          function one(s) { return document.querySelector(S + s); }
          function all(s) { return Array.prototype.slice.call(document.querySelectorAll(S + s)); }
          function cl(u) { return Math.max(0, Math.min(1, u)); }
          function out4(u) { u = cl(u); return 1 - Math.pow(1 - u, 4); }
          function io(u) { u = cl(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
          var T = __T__;
          var BAR = 240 / T.bpm, BEAT = BAR / 4, END = T.bars * BAR;
          function B(x) { return x * BAR; }
          function on(t, a, b) { return t >= B(a) && t < B(b); }

          // a hard cut in, with a 4-frame settle (no float, no bounce)
          function snap(el, t, a, b, dy) {
            if (t < B(a) || t >= B(b)) { el.style.opacity = 0; return; }
            var u = out4((t - B(a)) / 0.14);
            el.style.opacity = 1;
            el.style.transform = "translateY(" + ((1 - u) * (dy === undefined ? 16 : dy)).toFixed(1) + "px) scale(" + (1 + (1 - u) * 0.025).toFixed(4) + ")";
          }
          // a slam: big type lands from 108%, sharp
          function slam(el, t, a, b) {
            if (t < B(a) || t >= B(b)) { el.style.opacity = 0; return; }
            var u = out4((t - B(a)) / 0.12);
            el.style.opacity = 1;
            el.style.transform = "scale(" + (1.08 - 0.08 * u).toFixed(4) + ")";
          }
          // typed text: characters appear one by one between t0 and t1
          function typeOn(spans, t, t0, t1) {
            var n = spans.length, k = t <= t0 ? 0 : t >= t1 ? n : Math.floor(n * (t - t0) / (t1 - t0));
            for (var i = 0; i < n; i++) spans[i].style.opacity = i < k ? 1 : 0;
            return k;
          }

          // the grid draws in on the first beat
          var gH = one("#gridH"), gV = one("#gridV");
          function grid(t) {
            var u = io(t / 0.5);
            gH.style.clipPath = "inset(0 " + ((1 - u) * 100).toFixed(2) + "% 0 0)";
            gV.style.clipPath = "inset(0 0 " + ((1 - u) * 100).toFixed(2) + "% 0)";
          }

          // the index, top left
          var IDX = [[0, "01", "Signal"], [2, "02", "Play"], [6, "03", "Email"], [8, "04", "Send"], [9, "05", "Meeting"], [11, "", "Plays"]];
          var idxn = one("#idxn"), idxw = one("#idxw"), idx = one("#idx");
          function index(t) {
            var cur = IDX[0];
            IDX.forEach(function (r) { if (t >= B(r[0])) cur = r; });
            idxn.textContent = cur[1]; idxw.textContent = cur[2];
            idx.firstChild.nodeValue = "";
            idx.childNodes[1].nodeValue = cur[1] ? " / " : "";
            var u = (t - B(cur[0])) / 0.12;
            idx.style.opacity = u < 0 ? 0 : 1;
          }

          // the signal labels and the counter
          var lbls = all(".lbl");
          lbls.forEach(function (l, i) { l.style.top = (330 + i * 70) + "px"; });
          var cnum = one("#cnum"), counter = one("#counter");

          // cards
          var cRun = one("#c-run"), cAcc = one("#c-acc"), cThink = one("#c-think"), cAp = one("#c-ap"), cDn = one("#c-dn");
          var sigs = all("#c-acc .sig"), acts = all("#c-acc .pill.act");
          var sayCh = all("#c-think .say .ch");
          var cb = one("#c-ap .cb"), okTag = one("#c-ap .pill.ok"), stTo = one("#st-to"), runChip = one("#c-run .pill.vio");

          // the email
          var email = one("#email"), caret = one("#caret");
          var subCh = all("#email .stx .ch"), bodyCh = all("#email .ebody .ch");
          var phs = { cfo: one('#email .ph[data-ph="cfo"]'), pricing: one('#email .ph[data-ph="pricing"]') };
          var elab = all("#elabels .el");
          var wires = { cfo: one("#wire-cfo"), pricing: one("#wire-pricing") }, dots = { cfo: one("#dot-cfo"), pricing: one("#dot-pricing") };
          // where each phrase's first character sits in the body (index into bodyCh)
          var phStart = {}, phEnd = {};
          Object.keys(phs).forEach(function (k) {
            var cs = Array.prototype.slice.call(phs[k].querySelectorAll(".ch"));
            phStart[k] = bodyCh.indexOf(cs[0]); phEnd[k] = bodyCh.indexOf(cs[cs.length - 1]);
          });
          var SIGROW = { cfo: 1, pricing: 2 };

          // layout positions, measured once (the cards sit where they will be in bars 4 and 5)
          function place(el, top) { el.style.top = top + "px"; }
          place(cRun, 176); place(cAcc, 326); place(cThink, 716); place(cAp, 300); place(cDn, 520);
          var geo = null;
          function measure() {
            var root = one("#root").getBoundingClientRect();
            function rel(el) { var r = el.getBoundingClientRect(); return { x: r.left - root.left, y: r.top - root.top, w: r.width, h: r.height }; }
            geo = {};
            Object.keys(phs).forEach(function (k) {
              var row = rel(sigs[SIGROW[k]]), ph = rel(phs[k].querySelector(".ch")), em = rel(email);
              geo[k] = { x0: row.x + row.w - 6, y0: row.y + row.h / 2, x1: em.x + 2, y1: ph.y + ph.h / 2 };
            });
          }
          function wire(k, t, at) {
            var p = wires[k], d = dots[k], g = geo && geo[k];
            if (!g || t < at) { p.setAttribute("d", ""); d.setAttribute("opacity", 0); return; }
            var u = io((t - at) / 0.35);
            var mx = (g.x0 + g.x1) / 2;
            var path = "M" + g.x0 + "," + g.y0 + " C" + mx + "," + g.y0 + " " + mx + "," + g.y1 + " " + g.x1 + "," + g.y1;
            p.setAttribute("d", path);
            var L = p.getTotalLength();
            p.style.strokeDasharray = L; p.style.strokeDashoffset = (L * (1 - u)).toFixed(1);
            d.setAttribute("cx", g.x0); d.setAttribute("cy", g.y0); d.setAttribute("opacity", 1);
          }

          var cam = one("#cam");
          // [bar, focus rect in layout px, scale]: holds push in slowly, moves glide between cards
          var CAMK = [[2.0, [160, 176, 680, 132], 1.5], [2.45, [160, 176, 680, 132], 1.58], [2.7, [160, 326, 680, 360], 1.38], [3.95, [160, 326, 680, 360], 1.46],
                      [4.2, [160, 716, 680, 232], 1.55], [5.5, [160, 716, 680, 232], 1.63], [5.95, [0, 0, 1920, 1080], 1.0]];
          function camAt(t) {
            var b = t / BAR, k = CAMK;
            function m(r, sc) { var cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2; return sc === 1 ? [0, 0, 1] : [650 - cx * sc, 560 - cy * sc, sc]; }
            if (b < k[0][0] || b >= 6) return [0, 0, 1];
            for (var i = 0; i < k.length - 1; i++) if (b < k[i + 1][0]) {
              var u = io((b - k[i][0]) / (k[i + 1][0] - k[i][0])), a = m(k[i][1], k[i][2]), c = m(k[i + 1][1], k[i + 1][2]);
              return [a[0] + (c[0] - a[0]) * u, a[1] + (c[1] - a[1]) * u, a[2] + (c[2] - a[2]) * u];
            }
            return [0, 0, 1];
          }
          var accLine = one("#c-acc .rw.big"), chips = all("#c-think .rw.small .pill");
          var flash = one("#flash"), tc = one("#tc"), disc = one("#disc");
          function pad(n) { return (n < 10 ? "0" : "") + n; }

          var drv = { t: 0 };
          function render() {
            try { draw(drv.t); }
            catch (e) { var d = one("#err"); d.textContent = "t=" + drv.t.toFixed(2) + " " + e.message + " | " + (e.stack || "").split("\n").slice(0, 3).join(" / "); d.style.display = "block"; }
          }
          function draw(t) {
            if (on(t, 6, 8)) measure();   // measured live: fonts and layout are settled by then
            grid(t); index(t);
            var f = Math.floor(t * 30);
            tc.textContent = "00:00:" + pad(Math.floor(f / 30)) + ":" + pad(f % 30);
            // a 1-frame ink flash on the big downbeats
            var fl = [0, 2, 11].some(function (b) { return t >= B(b) && t < B(b) + 1 / 30; });
            flash.style.opacity = fl && t > 0.02 ? 0.92 : 0;

            // 01 / Signal
            slam(one("#w-signal"), t, 0, 2); slam(one("#w-in"), t, 1, 2);
            lbls.forEach(function (l, i) { snap(l, t, i * 0.25 + 0.02, 2, 10); });
            if (on(t, 1, 2)) {
              var u = io((t - B(1.1)) / (B(0.7)));
              counter.style.opacity = t >= B(1.1) ? 1 : 0;
              cnum.textContent = Math.round(T.counter.to * u) + (u >= 1 ? T.counter.suffix : "");
            } else counter.style.opacity = 0;

            // 02 / Play: the agent reads the account, card by card, then thinks
            var c = camAt(t);
