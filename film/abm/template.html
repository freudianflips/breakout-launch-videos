      <script>
        (function () {
          var S = '[data-composition-id="abm"] ';

            one("#brandtag").style.opacity = bar < AT.close ? 1 : 0;
            var disc = bar < AT.turn ? "Captured from " + one("#bar .url").textContent : bar >= AT.ask && bar < AT.booked ? "Illustrative example" :
                       bar >= AT.switch && bar < AT.close ? "Source: getbreakout.ai/compare/qualified-alternative" : "";
            one("#disc").textContent = disc; one("#disc").style.opacity = disc ? 1 : 0;

            // ---- a slow drift through every read hold, so a pause never freezes (their site has its own camera)
            var marks = [AT.turn, AT.ask, AT.who, AT.why, AT.act, AT.booked, AT.switch, AT.buyout, AT.close, AT.end], st = 1;
            for (i = 0; i < marks.length - 1; i++) if (bar >= marks[i] && bar < marks[i + 1]) st = 1 + 0.018 * io((bar - marks[i]) / (marks[i + 1] - marks[i]));
            one("#stage").style.transform = "scale(" + st.toFixed(5) + ")";

            // ---- 01-02: their site, the push into their widget, the fold into 1 cell of the grid
            var c = camAt(bar);
            var cam = one("#cam");
            cam.style.transform = "translate(" + c[1].toFixed(2) + "px," + c[2].toFixed(2) + "px) scale(" + c[0].toFixed(5) + ")";
            cam.style.opacity = bar < AT.turn + 0.85 ? 1 : 1 - cl((bar - AT.turn - 0.85) / 0.1);
            notes.forEach(function (n, j) {
              n.style.top = (330 + j * 120) + "px";
              if (j === notes.length - 1) n.classList.add("v");
              slam(n, t, AT.widget + 0.75 + j * 0.5, AT.turn);
            });
            // the cursor tries every button, then looks for somewhere to type
            var bt = CAP.buttons, keys = [[AT.widget + 2.0, null]];
            bt.forEach(function (b, j) { keys.push([AT.widget + 2.25 + j * 0.2, fp(b[0], b[1])]); });
            keys.push([AT.widget + 3.15, fp(CAP.nobox[0], CAP.nobox[1])]);
            keys[0][1] = [keys[1][1][0] + 160, keys[1][1][1] + 260];
            one("#scrim").style.opacity = (cl((bar - AT.widget - 0.45) / 0.15) * (1 - cl((bar - AT.turn) / 0.08))).toFixed(3);
            var cur = one("#cur"), hl = one("#hl"), hover = -1;
            if (bar >= keys[0][0] - 0.1 && bar < AT.turn) {
              var p = keys[0][1];
              for (i = 1; i < keys.length; i++) {
                if (bar >= keys[i][0]) { p = keys[i][1]; if (i <= bt.length) hover = i - 1; else hover = -1; }
                else { var u = io((bar - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])); if (u > 0 && u < 1) p = [lerp(keys[i - 1][1][0], keys[i][1][0], u), lerp(keys[i - 1][1][1], keys[i][1][1], u)]; break; }
              }
              var q = scr(p, c), shake = bar >= keys[keys.length - 1][0] ? Math.sin((bar - keys[keys.length - 1][0]) * 90) * 10 * Math.exp(-(bar - keys[keys.length - 1][0]) * 14) : 0;
              cur.style.opacity = cl((bar - keys[0][0] + 0.1) / 0.05);
              cur.style.transform = "translate(" + (q[0] - 8 + shake).toFixed(1) + "px," + (q[1] - 4).toFixed(1) + "px)";
            } else cur.style.opacity = 0;
            if (hover >= 0) {
              var b = bt[hover], bw = (CAP.button_w || 356) * SC, bh = b[2] * SC, cp = fp(b[0], b[1]);
              hl.style.left = (cp[0] - bw / 2).toFixed(1) + "px"; hl.style.top = (cp[1] - bh / 2).toFixed(1) + "px";
              hl.style.width = bw.toFixed(1) + "px"; hl.style.height = bh.toFixed(1) + "px"; hl.style.opacity = 1;
            } else hl.style.opacity = 0;

            // ---- the turn
            turns.forEach(function (n, j) { n.style.top = (330 + j * 140) + "px"; slam(n, t, AT.turn + 0.3 + j * 0.3, AT.ask); });   // after the fold lands

            // ---- 03: ask anything
            slam(one("#asktitle"), t, AT.ask, AT.who);
            show(one("#today"), t, AT.ask + 0.4, AT.who);
            show(one("#bline"), t, AT.ask + 0.75, AT.who);
            var bwEl = one("#bw");
            show(bwEl, t, AT.ask, AT.who, 60);
            var qa = AT.ask + 0.5, qb = AT.ask + 1.2, sent = AT.ask + 1.35;
            var typing = bar < sent;
            ics.forEach(function (ch, j) { ch.style.opacity = typing && t >= B(qa) + j * (B(qb) - B(qa)) / ics.length ? 1 : 0; });
            one(".ph0").style.opacity = bar < qa || !typing ? 1 : 0;
            one(".bcaret").style.opacity = typing && bar >= qa && Math.floor(t * 4) % 2 === 0 ? 1 : (typing && bar >= qa ? 0.15 : 0);
            one(".bsend").style.transform = "scale(" + (bar >= sent && bar < sent + 0.06 ? 0.9 : 1) + ")";
            var ub = one(".ub"), su = inb(t, sent);
            ub.style.opacity = su >= 0 ? 1 : 0; ub.style.transform = "translateY(" + (su >= 0 ? 16 * (1 - out4(su / 0.08)) : 16).toFixed(1) + "px)";
            qcs.forEach(function (ch) { ch.style.opacity = 1; });
            var ar = one(".ar"), au = inb(t, sent + 0.05), aStart = sent + 0.4, WPB = 16;
            ar.style.opacity = au >= 0 ? 1 : 0;
            one(".dots").style.display = bar < aStart ? "flex" : "none";
            all(".dots i").forEach(function (d, j) { d.style.opacity = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 14 - j * 1.2))).toFixed(3); });
            aws.forEach(function (w, j) { w.style.opacity = bar >= aStart + j / WPB ? 1 : 0; });
            var mod = one(".mod"), ansTop = one(".ans").offsetTop + one(".ans").offsetHeight;
            mod.style.top = (130 + one(".ans").offsetHeight + 30) + "px";
            show(mod, t, aStart + aws.length / WPB + 0.1, AT.who, 18);

            // ---- 04: who
            var cw = one("#c-who");
            show(cw, t, AT.who, AT.why, 30);
            show(one("#w-co"), t, AT.who + 0.1, null, 10);
            show(one("#w-wf"), t, AT.who + 0.45, null, 10);
            show(one("#w-pe"), t, AT.who + 1.1, null, 10);
            provs.forEach(function (pv, j) { pv.className = "prov" + (bar >= AT.who + 0.55 + j * 0.15 && (j === provs.length - 1 || bar < AT.who + 0.7 + j * 0.15) ? " on" : ""); });
            all("#c-who .ck").forEach(function (k, j) { k.style.opacity = bar >= AT.who + (j ? 1.15 : 0.15) ? 1 : 0; });
            one("#w-pe").className = "rw" + (bar >= AT.who + 1.1 ? " on" : "");
            cmpRow(one("#rowwho"), t, AT.who + 1.5, AT.why);

            // ---- 05: why
            slam(one("#why1"), t, AT.why, AT.act);
            slam(one("#why2"), t, AT.why + 0.5, AT.act);
            show(one("#sighead"), t, AT.why + 0.9, AT.act);
            sigs.forEach(function (sg, j) {
              sg.style.top = (500 + j * 92) + "px";
              show(sg, t, AT.why + 0.9 + j * 0.08, AT.act, 16);
              var tg = sg.querySelector(".tag"), tu = inb(t, AT.why + 1.1 + j * 0.25);
              tg.style.opacity = tu >= 0 ? 1 : 0;
              tg.style.transform = "scale(" + (tu >= 0 ? 1.25 - 0.25 * out4(tu / 0.08) : 1).toFixed(3) + ")";
            });
            drawDots(t, bar);

            // ---- 06: act. The email the account sends, written on the beat
            cmpRow(one("#rowact"), t, AT.act, AT.switch - 1);
            var em = one("#email");
            show(em, t, AT.act, AT.booked + 0.2, 40);
            if (bar >= AT.booked) em.style.opacity = 0;
            var ws = AT.act + 0.75, EPB = 12;
            ewords.forEach(function (w, j) { var wu = inb(t, ws + j / EPB); w.style.opacity = wu >= 0 ? 1 : 0;
              w.style.transform = "translateY(" + (wu >= 0 ? 8 * (1 - out4(wu / 0.04)) : 8).toFixed(1) + "px)"; });
            ephs.forEach(function (ph) { var wl = ph.querySelectorAll(".w"), last = ewords.indexOf(wl[wl.length - 1]);
              ph.className = "ph" + (bar >= ws + (last + 1) / EPB + 0.06 ? " on" : ""); });
            var es = one("#esend");
            es.className = "esend" + (bar >= AT.send ? " press" : "");
            es.style.transform = "scale(" + (bar >= AT.send && bar < AT.send + 0.08 ? 0.93 : 1) + ")";
            if (bar >= AT.send - 0.3 && bar < AT.booked) {
              var sp = local(es), ku = io((bar - AT.send + 0.3) / 0.25);
              cur.style.opacity = 1;
              cur.style.transform = "translate(" + lerp(1500, sp.x + sp.w / 2 - 8, ku).toFixed(1) + "px," + lerp(1000, sp.y + sp.h / 2 - 4, ku).toFixed(1) + "px)" + (bar >= AT.send ? " scale(0.88)" : "");
            }

            // ---- meeting booked: violet floods out of Send
            var fu = inb(t, AT.booked), ru = inb(t, AT.switch);
            var o = { x: 1500, y: 860 };
            if (bar < AT.booked + 0.5) { var sp2 = local(es); o = { x: sp2.x + sp2.w / 2, y: sp2.y + sp2.h / 2 }; }
            var fr = fu < 0 ? 0 : ru < 0 ? 2400 * out4(fu / 0.22) : 2400 * (1 - io(ru / 0.2));
            var fo = ru < 0 ? [o.x, o.y] : [960, 540];
            one("#flood").style.clipPath = "circle(" + fr.toFixed(1) + "px at " + fo[0].toFixed(1) + "px " + fo[1].toFixed(1) + "px)";
            var outB = 1 - cl(ru / 0.05);
            var bk = inb(t, AT.booked + 0.08);
            one("#bigok").style.opacity = bk >= 0 ? (cl(bk / 0.04) * outB).toFixed(3) : 0;
            one("#bigok").style.transform = "translateY(" + (bk >= 0 ? 40 * (1 - out4(bk / 0.12)) : 40).toFixed(1) + "px)";
            var tk = one("#tick"), tku = cl((fu - 0.1) / 0.25);
            tk.style.opacity = fu >= 0.1 ? outB : 0;
            var tc = tk.querySelector("circle"), tp = tk.querySelector("path");
            tc.setAttribute("stroke-dasharray", "541"); tc.setAttribute("stroke-dashoffset", (541 * (1 - out4(tku))).toFixed(1));
            tp.setAttribute("stroke-dasharray", "160"); tp.setAttribute("stroke-dashoffset", (160 * (1 - out4((fu - 0.25) / 0.2))).toFixed(1));
            var cb = one("#c-bd"), cu = inb(t, AT.booked + 0.2);
            cb.style.opacity = cu >= 0 ? (cl(cu / 0.05) * outB).toFixed(3) : 0;
            cb.style.transform = "translateY(" + (cu >= 0 ? 50 * (1 - out4(cu / 0.14)) : 50).toFixed(1) + "px)";
            faces.forEach(function (f, j) { var u2 = inb(t, AT.booked + 0.4 + j * 0.06); f.style.opacity = u2 >= 0 ? 1 : 0;
              f.style.transform = "scale(" + (u2 >= 0 ? 1.3 - 0.3 * out4(u2 / 0.06) : 1).toFixed(3) + ")"; });

            // ---- 07: the switch, then the buyout
            show(one("#swf"), t, AT.switch + 0.05, AT.buyout);
            slam(one("#swb"), t, AT.switch + 0.1, AT.buyout);
            show(one("#swbn"), t, AT.switch + 0.35, AT.buyout);
            slam(one("#swq"), t, AT.switch + 0.75, AT.buyout);
            show(one("#swqn"), t, AT.switch + 1.0, AT.buyout);
            var lu = inb(t, AT.switch + 0.6), lv = inb(t, AT.buyout);
            one("#swline").style.transform = "scaleX(" + (lu < 0 ? 0 : out4(lu / 0.15) * (lv > 0 ? 1 - cl(lv / 0.05) : 1)).toFixed(3) + ")";
            slam(one("#bo1"), t, AT.buyout, AT.close);
            slam(one("#bo2"), t, AT.buyout + 0.4, AT.close);
            show(one("#bon"), t, AT.buyout + 0.9, AT.close);

            // ---- close
            var lg = one("#llogo"), gu = inb(t, AT.close + 0.05);
            lg.style.opacity = gu >= 0 ? cl(gu / 0.06) : 0;
            lg.style.transform = "translateX(-50%) translateY(" + (gu >= 0 ? 16 * (1 - out4(gu / 0.15)) : 16).toFixed(1) + "px)";
            var ct = one("#lcta"), cu2 = inb(t, AT.close + 0.25);
            ct.style.opacity = cu2 >= 0 ? cl(cu2 / 0.04) : 0;
            ct.style.transform = "translateX(-50%) scale(" + (cu2 >= 0 ? 1.12 - 0.12 * out4(cu2 / 0.1) : 1).toFixed(4) + ")";
            show(one("#lurl"), t, AT.close + 0.4, null, 12);
            show(one("#lmade"), t, AT.close + 0.55, null, 12);
          }

          function cmpRow(el, t, a, b) {
            show(el.querySelector(".cf"), t, a, b, 10);
            show(el.querySelector(".cr.b"), t, a + 0.25, b, 16);
            show(el.querySelector(".cr.q"), t, a + 0.6, b, 16);
            show(el.querySelector(".csrc"), t, a + 0.8, b, 6);
          }
          // 700 signals as dots; 3 of them light with the rows
          var LIT = [137, 402, 611];
          function drawDots(t, bar) {
            dg.clearRect(0, 0, 660, 360);
            var u = inb(t, AT.why + 0.6), v = inb(t, AT.act);
            if (u < 0 || v > 0.05) return;
            var a = v > 0 ? 1 - cl(v / 0.05) : 1;
            for (var k = 0; k < 700; k++) {
              var col = k % 28, row = Math.floor(k / 28);
              if (col / 28 > u / 0.4) continue;
              var li = LIT.indexOf(k), on = li >= 0 && bar >= AT.why + 1.1 + li * 0.25;
              dg.globalAlpha = a;
              dg.fillStyle = on ? "#4c00ff" : "rgba(4,4,5,0.16)";
              dg.beginPath(); dg.arc(12 + col * 23.5, 8 + row * 14, on ? 7 : 3.5, 0, 6.2832); dg.fill();
            }
            dg.globalAlpha = 1;
          }
          function safe() { try { render(); } catch (e) { var er = one("#err"); er.style.display = "block"; er.textContent = e.stack || String(e); } }
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(drv, { t: 0.001 }, { t: END, duration: END - 0.001, ease: "none", onUpdate: safe, immediateRender: false }, 0.001);
          safe();
          window.__timelines["abm"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
