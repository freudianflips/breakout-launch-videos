            var p0 = AT.site + 0.9, p1 = AT.site + 1.4;
            var sw = 1 + 0.04 * cl(bar / p0), tw = [C0[0] * (1 - sw), C0[1] * (1 - sw)];
            if (bar < p0) return [sw, tw[0], tw[1]];
            var sh = S1 + 0.06 * cl((bar - p1) / (AT.hook - p1)), th = [TGT[0] - sh * WC[0], TGT[1] - sh * WC[1]], u = io((bar - p0) / (p1 - p0));
            return [lerp(1.04, sh, u), lerp(C0[0] * (1 - 1.04), th[0], u), lerp(C0[1] * (1 - 1.04), th[1], u)];
          }
          function scr(p, c) { return [c[0] * p[0] + c[1], c[0] * p[1] + c[2]]; }

          var notes = all(".note"), hooks = all(".hookl"), ics = all(".ic"), aws = all(".ans .w"), ewords = all("#email .w"), ephs = all("#email .ph");
          var chips = all(".schip"), provs = all(".prov"), faces = all(".face"), blobs = [one("#b1"), one("#b2"), one("#b3")];
          var gcv = one("#grain"), gg = gcv.getContext("2d"), gimg = gg.createImageData(640, 360);
          var CHIPPOS = [[170, 300], [1470, 250], [1370, 730]];
          var drv = { t: 0 };

          function render() {
            var t = drv.t, bar = t / BAR, i;
            var sh = shotAt(bar), w = W[sh[1]];

            // ---- the world
            one("#bg").style.background = w[0];
            blobs.forEach(function (b, j) {
              var ph = j * 2.1 + sh[0];
              b.style.background = "radial-gradient(circle, " + w[1][j] + " 0%, rgba(0,0,0,0) 68%)";
              b.style.transform = "translate(" + (lerp(-300, 1100, (j * 0.37 + 0.2) % 1) + 180 * Math.sin(t * 0.35 + ph)).toFixed(1) + "px," +
                (lerp(-500, 300, (j * 0.61 + 0.1) % 1) + 140 * Math.cos(t * 0.3 + ph)).toFixed(1) + "px)";
            });
            var light = sh[1] === "L";
            one("#vig").style.opacity = light ? 0.35 : 1;

            // ---- shake on every slam, a flash on every cut
            var sx = 0, sy = 0, fl = 0;
            SLAMS.forEach(function (a) { var d = t - B(a); if (d >= 0 && d < 0.5) { var e = Math.exp(-d / 0.09); sx += 9 * e * Math.sin(d * 70); sy += 6 * e * Math.cos(d * 55); } });
            CUTS.forEach(function (a) { var d = t - B(a); if (d >= 0 && d < 0.4) fl += Math.exp(-d / 0.07); });
            one("#stage").style.transform = "translate(" + sx.toFixed(2) + "px," + sy.toFixed(2) + "px)";
            one("#flash").style.opacity = Math.min(0.55, fl * 0.5).toFixed(3);

            // ---- the film: grain (seeded per frame) and the label in the bottom bar
            var fr = Math.floor(t * 24), seed = (fr * 9301 + 49297) % 233280, d = gimg.data;
            for (i = 0; i < d.length; i += 4) { seed = (seed * 9301 + 49297) % 233280; var v = (seed / 233280) * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
            gg.putImageData(gimg, 0, 0);
            var src = (bar >= AT.vs1 && bar < AT.why) || (bar >= AT.vs2 && bar < AT.act) || (bar >= AT.vs3 && bar < AT.close);
            var disc = bar < AT.hook ? "Captured from " + one("#bar .url").textContent : src ? "Source: getbreakout.ai/compare/qualified-alternative" :
                       bar >= AT.ask && bar < AT.booked ? "Illustrative example" : "";
            one("#disc").textContent = disc;

            // ---- their site, the push into their widget
            var site = bar < AT.hook, c = camAt(bar), cam = one("#cam");
            cam.style.opacity = site ? 1 : 0;
            cam.style.transform = "translate(" + c[1].toFixed(2) + "px," + c[2].toFixed(2) + "px) scale(" + c[0].toFixed(5) + ")";
            one("#scrim").style.opacity = site ? cl((bar - AT.site - 1.25) / 0.15).toFixed(3) : 0;
            notes.forEach(function (n, j) { n.style.top = (330 + j * 160) + "px"; cut(n, t, AT.site + 1.5 + j * 0.5, AT.hook, { dy: 20 }); });
            var bt = CAP.buttons, keys = [[AT.site + 1.4, null]];
            bt.forEach(function (b, j) { keys.push([AT.site + 1.6 + j * 0.15, fp(b[0], b[1])]); });
            keys.push([AT.site + 2.4, fp(CAP.nobox[0], CAP.nobox[1])]);
            keys[0][1] = [keys[1][1][0] + 160, keys[1][1][1] + 260];
            var cur = one("#cur"), hl = one("#hl"), hover = -1;
            cur.style.opacity = 0;
            if (bar >= keys[0][0] && site) {
              var p = keys[0][1];
              for (i = 1; i < keys.length; i++) {
                if (bar >= keys[i][0]) { p = keys[i][1]; hover = i <= bt.length ? i - 1 : -1; }
                else { var u = io((bar - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])); p = [lerp(keys[i - 1][1][0], keys[i][1][0], u), lerp(keys[i - 1][1][1], keys[i][1][1], u)]; break; }
              }
              var q = scr(p, c), k0 = keys[keys.length - 1][0], shk = bar >= k0 ? Math.sin((bar - k0) * 90) * 12 * Math.exp(-(bar - k0) * 12) : 0;
              cur.style.opacity = 1;
              cur.style.transform = "translate(" + (q[0] - 8 + shk).toFixed(1) + "px," + (q[1] - 4).toFixed(1) + "px)";
            }
            if (hover >= 0 && site) {
              var b = bt[hover], bw = (CAP.button_w || 356) * SC, bh = b[2] * SC, cp = fp(b[0], b[1]);
              hl.style.left = (cp[0] - bw / 2).toFixed(1) + "px"; hl.style.top = (cp[1] - bh / 2).toFixed(1) + "px";
              hl.style.width = bw.toFixed(1) + "px"; hl.style.height = bh.toFixed(1) + "px"; hl.style.opacity = 1;
            } else hl.style.opacity = 0;

            // ---- the hook
            hooks.forEach(function (n, j) { n.style.top = (350 + j * 160) + "px"; cut(n, t, AT.hook + j * 0.5, AT.year, { dy: 24 }); });
            cut(one("#year"), t, AT.year, AT.agent, { from: 1.15, drift: 0.04 });
            cut(one("#agent"), t, AT.agent, AT.ask, { from: 1.12, drift: 0.05 });

            // ---- ask anything
            cut(one("#asktitle"), t, AT.ask, AT.who, { dy: 20 });
            cut(one("#asksub"), t, AT.ask + 0.5, AT.who, { dy: 14, from: 1 });
            var bwr = one("#bwrap"), au0 = inb(t, AT.ask);
            bwr.style.opacity = bar >= AT.ask && bar < AT.who ? cl(au0 / 0.03) : 0;
            bwr.style.transform = "translateY(" + (90 * (1 - out4(au0 / 0.25))).toFixed(1) + "px)";
            one("#bw").style.transform = "rotateY(" + lerp(-20, -7, io(au0 / 3)).toFixed(2) + "deg) rotateX(" + lerp(6, 2, io(au0 / 3)).toFixed(2) + "deg)";
            var qa = AT.ask + 0.25, qb = AT.ask + 0.75, sent = AT.ask + 0.85, typing = bar < sent;
            ics.forEach(function (ch, j) { ch.style.opacity = typing && t >= B(qa) + j * (B(qb) - B(qa)) / ics.length ? 1 : 0; });
            one(".ph0").style.opacity = bar < qa || !typing ? 1 : 0;
            one(".bcaret").style.opacity = typing && bar >= qa ? (Math.floor(t * 4) % 2 === 0 ? 1 : 0.15) : 0;
            var ub = one(".ub"), su = inb(t, sent);
            ub.style.opacity = su >= 0 ? 1 : 0; ub.style.transform = "translateY(" + (su >= 0 ? 16 * (1 - out4(su / 0.08)) : 16).toFixed(1) + "px)";
            var aStart = AT.ask + 1.2;
            one(".ar").style.opacity = bar >= sent + 0.05 ? 1 : 0;
            one(".dots").style.display = bar < aStart ? "flex" : "none";
            all(".dots i").forEach(function (dd, j) { dd.style.opacity = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 14 - j * 1.2))).toFixed(3); });
            aws.forEach(function (ww, j) { ww.style.opacity = bar >= aStart + j / 16 ? 1 : 0; });
            var mod = one(".mod");
            mod.style.top = (124 + one(".ans").offsetHeight + 34) + "px";
            var mu = inb(t, aStart + aws.length / 16 + 0.08);
            mod.style.opacity = mu >= 0 ? cl(mu / 0.04) : 0;
            mod.style.transform = "translateY(" + (mu >= 0 ? 18 * (1 - out4(mu / 0.12)) : 18).toFixed(1) + "px)";

            // ---- who: not just the company, the person
            cut(one("#wholine"), t, AT.who, AT.who + 0.5, { from: 1.1 });
            var pe = one("#person"), pu = inb(t, AT.who + 0.5);
            cut(pe, t, AT.who + 0.5, AT.vs1, { from: 1.06, dy: 30 });
            provs.forEach(function (pv, j) { pv.className = "prov" + (bar >= AT.who + 0.6 + j * 0.1 ? " on" : ""); });
            one(".match").style.opacity = bar >= AT.who + 0.9 ? 1 : 0;
            versus(one("#vs1"), t, AT.vs1, AT.why);

            // ---- why: 700+ signals, then Qualified's one
            var cn = one("#count"), cu = inb(t, AT.why);
            cut(cn, t, AT.why, AT.vs2, { from: 1.12, drift: 0.04 });
            cn.textContent = Math.round(T.count * out4(cu / 0.3)) + (cu >= 0.3 ? T.suffix : "");
            cut(one("#countlabel"), t, AT.why + 0.125, AT.vs2, { dy: 20 });
            chips.forEach(function (ch, j) {
              var pos = CHIPPOS[j % 3], u2 = inb(t, AT.why + 0.25 + j * 0.125);
              ch.style.left = pos[0] + "px"; ch.style.top = pos[1] + "px";
              ch.style.opacity = u2 >= 0 && bar < AT.vs2 ? 1 : 0;
              ch.style.transform = "scale(" + (u2 >= 0 ? 1.3 - 0.3 * out4(u2 / 0.1) : 1).toFixed(3) + ") translateY(" + (-10 * Math.sin(t * 2 + j)).toFixed(1) + "px)";
            });
            cut(one("#vs2w"), t, AT.vs2, AT.act, { from: 1 });
            cut(one("#vs2q"), t, AT.vs2, AT.act, { from: 1.1 });

            // ---- act: it writes the email, and sends it
            cut(one("#act1"), t, AT.act, AT.booked, { dy: 20 });
            cut(one("#act2"), t, AT.send - 0.5, AT.booked, { dy: 20 });
            var ew = one("#ewrap"), eu = inb(t, AT.act);
            ew.style.opacity = bar >= AT.act && bar < AT.booked ? cl(eu / 0.03) : 0;
            ew.style.transform = "translateY(" + (90 * (1 - out4(eu / 0.25))).toFixed(1) + "px)";
            one("#email").style.transform = "rotateY(" + lerp(-16, -5, io(eu / 3.5)).toFixed(2) + "deg) rotateX(" + lerp(5, 1, io(eu / 3.5)).toFixed(2) + "deg)";
            var ws = AT.act + 0.25;
            ewords.forEach(function (ww, j) { var wu = inb(t, ws + j / 16); ww.style.opacity = wu >= 0 ? 1 : 0;
              ww.style.transform = "translateY(" + (wu >= 0 ? 8 * (1 - out4(wu / 0.04)) : 8).toFixed(1) + "px)"; });
            ephs.forEach(function (ph) { var wl = ph.querySelectorAll(".w"), last = ewords.indexOf(wl[wl.length - 1]);
              ph.className = "ph" + (bar >= ws + (last + 1) / 16 + 0.06 ? " on" : ""); });
            var es = one("#esend");
            es.className = "esend" + (bar >= AT.send ? " press" : "");
            es.style.transform = "scale(" + (bar >= AT.send && bar < AT.send + 0.08 ? 0.93 : 1) + ")";
            if (bar >= AT.send - 0.3 && bar < AT.booked) {
              var sp = local(es), ku = io((bar - AT.send + 0.3) / 0.25);
              cur.style.opacity = 1;
              cur.style.transform = "translate(" + lerp(1500, sp.x + sp.w / 2 - 8, ku).toFixed(1) + "px," + lerp(1000, sp.y + sp.h / 2 - 4, ku).toFixed(1) + "px)" + (bar >= AT.send ? " scale(0.88)" : "");
            }

            // ---- meeting booked: violet floods out of Send
            var fu = inb(t, AT.booked), on = bar >= AT.booked && bar < AT.vs3;
            var o = { x: 1500, y: 860 };
            if (bar < AT.booked + 0.5) { var sp2 = local(es); if (sp2.w) o = { x: sp2.x + sp2.w / 2, y: sp2.y + sp2.h / 2 }; }
            one("#flood").style.clipPath = "circle(" + (on ? 2400 * out4(fu / 0.22) : 0).toFixed(1) + "px at " + o.x.toFixed(1) + "px " + o.y.toFixed(1) + "px)";
            cut(one("#bigok"), t, AT.booked + 0.08, AT.vs3, { dy: 40 });
            var tk = one("#tick"), tku = cl((fu - 0.1) / 0.25);
            tk.style.opacity = on && fu >= 0.1 ? 1 : 0;
            var tc = tk.querySelector("circle"), tp = tk.querySelector("path");
            tc.setAttribute("stroke-dasharray", "541"); tc.setAttribute("stroke-dashoffset", (541 * (1 - out4(tku))).toFixed(1));
            tp.setAttribute("stroke-dasharray", "160"); tp.setAttribute("stroke-dashoffset", (160 * (1 - out4((fu - 0.25) / 0.2))).toFixed(1));
            cut(one("#c-bd"), t, AT.booked + 0.2, AT.vs3, { dy: 50, from: 1 });
            faces.forEach(function (f, j) { var u2 = inb(t, AT.booked + 0.4 + j * 0.06); f.style.opacity = u2 >= 0 ? 1 : 0;
              f.style.transform = "scale(" + (u2 >= 0 ? 1.3 - 0.3 * out4(u2 / 0.06) : 1).toFixed(3) + ")"; });
            versus(one("#vs3"), t, AT.vs3, AT.buyout);

            // ---- buyout
            cut(one("#bo1"), t, AT.buyout, AT.close, { dy: 20 });
            cut(one("#bo2"), t, AT.buyout + 0.375, AT.close, { dy: 20 });
            cut(one("#bon"), t, AT.buyout + 0.75, AT.close, { dy: 12, from: 1 });

            // ---- close
            var lg = one("#llogo"), gu = inb(t, AT.close + 0.05);
            lg.style.opacity = gu >= 0 ? cl(gu / 0.04) : 0;
            lg.style.transform = "translateY(" + (gu >= 0 ? 20 * (1 - out4(gu / 0.2)) : 20).toFixed(1) + "px) scale(" + (gu >= 0 ? lerp(1.06, 1, out4(gu / 0.3)) : 1).toFixed(4) + ")";
            cut(one("#lcta"), t, AT.close + 0.25, null, { from: 1.12, drift: 0 });
            cut(one("#lmade"), t, AT.close + 0.45, null, { dy: 14, drift: 0 });
            cut(one("#lurl"), t, AT.close + 0.6, null, { dy: 10, from: 1, drift: 0 });
          }

          // a split screen: Breakout wipes in on violet, Qualified a beat later on grey
          function versus(el, t, a, b) {
            var bar = t / BAR, on = bar >= a && bar < b;
            el.style.opacity = on ? 1 : 0;
            if (!on) return;
            var u1 = inb(t, a), u2 = inb(t, a + 0.25);
            el.querySelector(".hb").style.clipPath = "inset(0 " + (100 * (1 - out4(u1 / 0.12))).toFixed(2) + "% 0 0)";
            el.querySelector(".hq").style.clipPath = "inset(0 0 0 " + (100 * (1 - out4(u2 / 0.12))).toFixed(2) + "%)";
            cut(el.querySelector(".vb"), t, a + 0.04, b, { dy: 20 });
            cut(el.querySelector(".vq"), t, a + 0.29, b, { dy: 20 });
            el.querySelector(".hq").style.visibility = u2 >= 0 ? "visible" : "hidden";
            cut(el.querySelector(".vlabel"), t, a, b, { from: 1 });
          }
          function safe() { try { render(); } catch (e) { var er = one("#err"); er.style.display = "block"; er.textContent = e.stack || String(e); } }
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(drv, { t: 0.001 }, { t: END, duration: END - 0.001, ease: "none", onUpdate: safe, immediateRender: false }, 0.001);
          safe();
          window.__timelines["abm"] = tl;
        })();
      </script>
    </template>
