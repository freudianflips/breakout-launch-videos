<!doctype html>
<html>
  <body>
    <template>
      <!-- Signals launch, in the Swiss-grid look: a visitor on a pricing page, Breakout listening to 35+ signals,
           the intel arriving next to the cursor one signal at a time, then the website agent and the AI SDR email
           using it, with a line from each signal to the words it shaped. Built by build.py; every frame is a pure
           function of t (draw(t) sets every element from nothing). -->
      <style>
        __FONTFACES__
        [data-composition-id="signals"] { --paper: #f2f1ee; --ink: #040405; --ink2: #5c5850; --mute: #8a8a92; --violet: #4c00ff;
          --card: #2b2a2e; --line: rgba(4, 4, 5, 0.08); --sans: "Manrope", system-ui, sans-serif; --mono: "Fragment Mono", ui-monospace, monospace; }
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); font-family: var(--sans); color: var(--ink); }
        #gridH, #gridV { position: absolute; inset: 0; }
        #gridH { background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 120px; }
        #gridV { background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 160px 100%; }
        .mono { font-family: var(--mono); }
        #brandtag { position: absolute; right: 160px; top: 64px; font-size: 22px; }
        #disc { position: absolute; right: 160px; bottom: 54px; font-family: var(--mono); font-size: 18px; color: var(--mute); }
        .hl { position: absolute; left: 160px; top: 110px; width: 1600px; font-size: 68px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.02; opacity: 0; }
        .v { color: var(--violet); font-style: normal; }

        /* the pricing page */
        #browser { position: absolute; left: 160px; top: 300px; width: 1000px; height: 650px; background: #fff; border-radius: 18px; overflow: hidden;
          box-shadow: 0 50px 100px -50px rgba(10, 10, 20, 0.35), 0 0 0 1px #e3e1dc; opacity: 0; }
        .chrome { height: 54px; background: #f6f5f2; border-bottom: 1px solid #e8e6e1; display: flex; align-items: center; gap: 9px; padding: 0 20px; }
        .chrome i { width: 13px; height: 13px; border-radius: 50%; background: #dcd9d2; }
        .chrome .url { margin-left: 20px; flex: 1; height: 32px; border-radius: 8px; background: #fff; border: 1px solid #e8e6e1; font-family: var(--mono); font-size: 17px;
          color: var(--ink2); display: flex; align-items: center; padding: 0 14px; }
        .page { padding: 34px 44px; }
        .ptitle { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 26px; }
        .plans { display: flex; gap: 22px; }
        .plan { flex: 1; height: 440px; border-radius: 16px; border: 1.5px solid #e6e4df; padding: 24px; position: relative; }
        .plan.hot { border-color: var(--ink); }
        .plan b { display: block; font-size: 24px; font-weight: 700; margin-bottom: 20px; }
        .plan .bar { display: block; height: 16px; border-radius: 6px; background: #ebe9e4; margin-bottom: 12px; }
        .plan .bar.tall { height: 34px; background: #e2e0da; margin-bottom: 26px; }
        .plan .w60 { width: 60%; } .plan .w40 { width: 45%; }
        .plan .ln { display: block; height: 11px; border-radius: 5px; background: #f0eee9; margin-bottom: 14px; width: 85%; }
        .plan .ln.s { width: 60%; }
        .plan .btn { position: absolute; left: 24px; right: 24px; bottom: 24px; height: 48px; border-radius: 10px; background: #ebe9e4; }
        .plan.hot .btn { background: var(--ink); }

        /* the cursor, its name tag and Breakout listening */
        #cursor { position: absolute; left: 0; top: 0; z-index: 30; opacity: 0; }
        #arrow { position: absolute; left: 0; top: 0; width: 38px; height: 38px; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.25)); }
        #tag { position: absolute; left: 30px; top: 34px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 12px;
          background: var(--ink); color: #fff; font-size: 22px; white-space: nowrap; opacity: 0; box-shadow: 0 16px 30px -12px rgba(0, 0, 0, 0.4); }
        #tag img { width: 34px; height: 34px; border-radius: 8px; }
        #tag b { font-weight: 700; }
        #tag .at { color: #b9b8c0; }
        #tag .act { margin-left: 6px; }
        #listen { position: absolute; left: 30px; top: 92px; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 12px;
          background: #fff; color: var(--ink); font-size: 20px; font-weight: 600; white-space: nowrap; opacity: 0; box-shadow: 0 0 0 1.5px var(--violet), 0 16px 30px -14px rgba(76, 0, 255, 0.5); }
        #listen .spin { width: 22px; height: 22px; }
        .spin circle { fill: none; stroke: rgba(76, 0, 255, 0.18); stroke-width: 3; }
        .spin path { fill: none; stroke: var(--violet); stroke-width: 3; stroke-linecap: round; }
        .av { width: 34px; height: 34px; border-radius: 50%; background: var(--violet); display: inline-flex; align-items: center; justify-content: center; flex: none; }
        .av img { width: 34px; height: 34px; }
        .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; font-size: 18px; font-weight: 700; }
        .pill.act { background: var(--violet); color: #fff; opacity: 0; }

        /* the intel, one signal at a time */
        #stack { position: absolute; left: 1220px; top: 300px; width: 540px; }
        .ic { position: relative; height: 112px; margin-bottom: 14px; border-radius: 16px; background: var(--card); color: #f1f1f3; padding: 16px 22px; opacity: 0;
          box-shadow: 0 30px 60px -36px rgba(10, 10, 20, 0.55); }
        .ic.lit { box-shadow: 0 0 0 3px var(--violet), 0 30px 60px -36px rgba(10, 10, 20, 0.55); }
        .ic .fam { font-family: var(--mono); font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: #a9a7b8; }
        .ic .ld { position: absolute; left: 22px; right: 22px; top: 50px; display: flex; align-items: center; gap: 12px; font-size: 20px; color: #c9c7d6; }
        .ic .ld .spin { width: 24px; height: 24px; }
        .ic .ld .spin circle { stroke: rgba(255, 255, 255, 0.15); } .ic .ld .spin path { stroke: #b9a8ff; }
        .ic .shim { flex: 1; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #3a3940 0%, #55535e 50%, #3a3940 100%); background-size: 300px 100%; }
        .ic .ct { position: absolute; left: 22px; right: 70px; top: 44px; opacity: 0; }
        .ic .ct b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
        .ic .ct span { display: block; font-size: 20px; color: #c7b8ff; margin-top: 4px; }
        .ic .ok { position: absolute; right: 22px; top: 38px; width: 34px; height: 34px; padding: 6px; border-radius: 50%; background: var(--violet);
          fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }

        /* the website agent */
        #chat { position: absolute; left: 520px; top: 150px; width: 450px; background: #fff; border-radius: 18px; opacity: 0; z-index: 5;
          box-shadow: 0 40px 80px -30px rgba(10, 10, 20, 0.45), 0 0 0 1px #e3e1dc; transform-origin: 100% 100%; }
        .chd { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #eeece8; font-size: 21px; }
        .chd .live { width: 10px; height: 10px; border-radius: 50%; background: #2fb37a; margin-left: auto; }
        .bub { margin: 16px 20px; padding: 14px 18px; border-radius: 16px; font-size: 22px; line-height: 1.42; font-weight: 500; }
        .bub.ag { background: #f3f1fb; border-top-left-radius: 4px; }
        .bub.me { background: var(--ink); color: #fff; margin-left: 120px; border-top-right-radius: 4px; opacity: 0; }
        .ch { opacity: 0; }
        .ph.on { background: rgba(76, 0, 255, 0.12); color: var(--violet); border-radius: 5px; box-shadow: 0 0 0 3px rgba(76, 0, 255, 0.12); }

        /* the AI SDR email */
        #email { position: absolute; left: 160px; top: 300px; width: 1000px; padding: 34px 44px 40px; background: #fff; border-radius: 18px; opacity: 0;
          box-shadow: 0 50px 100px -50px rgba(10, 10, 20, 0.35), 0 0 0 1px #e3e1dc; }
        #email .eh { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 19px; color: var(--ink2); }
        #email .sent { margin-left: auto; background: var(--violet); color: #fff; font-family: var(--sans); opacity: 0; }
        #email .sent svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        #email .eto { font-size: 21px; color: var(--ink2); margin-top: 18px; }
        #email .esub { margin-top: 14px; padding-bottom: 20px; border-bottom: 1px solid #ecebe7; display: flex; gap: 16px; align-items: baseline; }
        #email .lab { font-family: var(--mono); font-size: 18px; color: var(--mute); }
        #email .stx { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        #email .ebody { margin-top: 24px; font-size: 30px; line-height: 1.5; font-weight: 500; color: #26262b; }

        #wires { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; z-index: 20; }
        #wires path { fill: none; stroke: var(--violet); stroke-width: 3; }
        #wires circle { fill: var(--violet); }

        /* the close */
        #llogo { position: absolute; left: 160px; top: 520px; height: 96px; opacity: 0; }
        #lline { position: absolute; left: 160px; top: 680px; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; opacity: 0; }
        #lurl { position: absolute; left: 160px; top: 790px; font-family: var(--mono); font-size: 28px; color: var(--violet); opacity: 0; }
      </style>
      <div id="root" data-composition-id="signals" data-width="1920" data-height="1080">
        <div id="gridH"></div><div id="gridV"></div>
        <div id="brandtag" class="mono">__BRANDTAG__</div>
        __HEADS__
        __BROWSER__
        <div id="stack">__CARDS__</div>
        __EMAIL__
        <svg id="wires">__WIRES__</svg>
        __CURSOR__
        <img id="llogo" src="__LOGO__" alt="">
        <div id="lline">__LINE__</div>
        <div id="lurl">__URL__</div>
        <div id="disc">__DISCLAIMER__</div>
      </div>
      <script>
        (function () {
          var S = '[data-composition-id="signals"] ';
          function one(s) { return document.querySelector(S + s); }
          function all(s) { return Array.prototype.slice.call(document.querySelectorAll(S + s)); }
          function cl(u) { return Math.max(0, Math.min(1, u)); }
          function out4(u) { u = cl(u); return 1 - Math.pow(1 - u, 4); }
          function io(u) { u = cl(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
          function lerp(a, b, u) { return a + (b - a) * u; }
          var T = __T__;
          var BAR = 240 / T.bpm, END = T.bars * BAR, A = T.at;
          function B(x) { return x * BAR; }
          // a hard cut in with a 4-frame settle; out the same way
          function snap(el, t, a, b, dy) {
            if (t < B(a) || t >= B(b)) { el.style.opacity = 0; return 0; }
            var u = out4((t - B(a)) / 0.14);
            el.style.opacity = 1;
            el.style.transform = "translateY(" + ((1 - u) * (dy === undefined ? 16 : dy)).toFixed(1) + "px) scale(" + (1 + (1 - u) * 0.025).toFixed(4) + ")";
            return u;
          }
          function typeOn(spans, t, t0, t1) {
            var n = spans.length, k = t <= B(t0) ? 0 : t >= B(t1) ? n : Math.floor(n * (t - B(t0)) / (B(t1) - B(t0)));
            for (var i = 0; i < n; i++) spans[i].style.opacity = i < k ? 1 : 0;
            return k;
          }
          var gH = one("#gridH"), gV = one("#gridV");
          function grid(t) { var u = io(t / 0.5); gH.style.clipPath = "inset(0 " + ((1 - u) * 100).toFixed(2) + "% 0 0)"; gV.style.clipPath = "inset(0 0 " + ((1 - u) * 100).toFixed(2) + "% 0)"; }

          var heads = all(".hl"), browser = one("#browser"), chat = one("#chat"), me = one("#chat .bub.me");
          var cursor = one("#cursor"), tag = one("#tag"), act = one("#act"), listen = one("#listen");
          var cards = all(".ic"), email = one("#email"), sent = one("#sent");
          var agCh = all("#chat .bub.ag .ch"), subCh = all("#email .stx .ch"), bodyCh = all("#email .ebody .ch");
          var llogo = one("#llogo"), lline = one("#lline"), lurl = one("#lurl"), root = one("#root");
          var spins = all(".spin");

          // the cursor's path: in from the bottom right, onto the plan, then aside for the chat
          var CUR = [[0.15, 1500, 1060], [0.9, 640, 790], [A.agent, 640, 790], [A.agent + 0.35, 330, 760]];
          function curAt(t) {
            var b = t / BAR, k = CUR;
            if (b <= k[0][0]) return [k[0][1], k[0][2]];
            for (var i = 0; i < k.length - 1; i++) if (b < k[i + 1][0]) { var u = io((b - k[i][0]) / (k[i + 1][0] - k[i][0])); return [lerp(k[i][1], k[i + 1][1], u), lerp(k[i][2], k[i + 1][2], u)]; }
            var l = k[k.length - 1]; return [l[1], l[2]];
          }
          // wires: from the card a phrase came from to the phrase itself
          var wireEls = T.wires.map(function (w) {
            var ph = one((w[0] === "chat" ? "#chat .bub.ag" : "#email .ebody") + ' .ph[data-ph="' + w[1] + '"]');
            var pool = w[0] === "chat" ? agCh : bodyCh, first = ph.querySelector(".ch");
            return { src: w[0], key: w[1], ph: ph, path: one("#w-" + w[0] + "-" + w[1]), dot: one("#d-" + w[0] + "-" + w[1]),
                     card: cards[T.keys.indexOf(w[1])], startIdx: pool.indexOf(first), box: w[0] === "chat" ? one("#chat") : one("#email") };
          });
          function rel(el) { var r = el.getBoundingClientRect(), o = root.getBoundingClientRect(); return { x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height }; }
          function wire(w, t, at, live) {
            if (!live || t < at) { w.path.setAttribute("d", ""); w.dot.setAttribute("opacity", 0); w.ph.classList.remove("on"); return false; }
            var c = rel(w.card), lastCh = w.ph.querySelectorAll(".ch"), p = rel(lastCh[lastCh.length - 1]), box = rel(w.box);
            var x0 = c.x, y0 = c.y + c.h / 2, x1 = box.x + box.w, y1 = p.y + p.h / 2, mx = (x0 + x1) / 2;
            var u = io((t - at) / 0.35);
            w.path.setAttribute("d", "M" + x0 + "," + y0 + " C" + mx + "," + y0 + " " + mx + "," + y1 + " " + x1 + "," + y1);
            var L = w.path.getTotalLength();
            w.path.style.strokeDasharray = L; w.path.style.strokeDashoffset = (L * (1 - u)).toFixed(1);
            w.dot.setAttribute("cx", x0); w.dot.setAttribute("cy", y0); w.dot.setAttribute("opacity", 1);
            w.ph.classList.add("on");
            return true;
          }

          function draw(t) {
            grid(t);
            spins.forEach(function (s) { s.style.transform = "rotate(" + ((t * 400) % 360).toFixed(1) + "deg)"; });
            T.heads.forEach(function (h, i) { snap(heads[i], t, h[0] + (i ? 0 : 0.02), h[1], 18); });

            // the page, until the email takes over
            var out = io((t - B(A.email)) / 0.3);
            if (t < B(A.email) + 0.35) { snap(browser, t, 0.02, 99, 24); browser.style.transform += " translateX(" + (-1300 * out).toFixed(1) + "px)"; }
            else browser.style.opacity = 0;

            // the cursor, its tag, and Breakout listening
            if (t >= B(0.15) && t < B(A.email) + 0.35) {
              var p = curAt(t);
              cursor.style.opacity = 1; cursor.style.transform = "translate(" + (p[0] - 1300 * out).toFixed(1) + "px," + p[1].toFixed(1) + "px)";
            } else cursor.style.opacity = 0;
            snap(tag, t, A.tag, 99, 8);
            snap(listen, t, A.listen, A.act, 8);
            act.style.opacity = t >= B(A.act) ? 1 : 0;
            act.style.transform = "scale(" + (1.25 - 0.25 * out4((t - B(A.act)) / 0.15)).toFixed(3) + ")";

            // the intel: each card loads, then its finding snaps in
            var cardsOut = io((t - B(A.close)) / 0.3);
            cards.forEach(function (c, i) {
              var a = A.cards[i];
              snap(c, t, a, 99, 14);
              if (t >= B(a)) c.style.transform += " translateX(" + (700 * cardsOut).toFixed(1) + "px)";
              var done = t >= B(a + A.load);
              c.querySelector(".ld").style.opacity = done ? 0 : 1;
              c.querySelector(".shim").style.backgroundPosition = ((t * 600) % 300).toFixed(1) + "px 0";
              var ct = c.querySelector(".ct"), ok = c.querySelector(".ok"), u = out4((t - B(a + A.load)) / 0.14);
              ct.style.opacity = done ? 1 : 0; ct.style.transform = "translateY(" + ((1 - u) * 8).toFixed(1) + "px)";
              ok.style.opacity = done ? 1 : 0; ok.style.transform = "scale(" + (done ? 0.6 + 0.4 * u : 0.6).toFixed(3) + ")";
              c.classList.toggle("lit", t >= B(a + A.load) && t < B(a + A.load) + 0.4);
            });

            // the website agent
            var cu = snap(chat, t, A.agent, A.email + 0.2, 30);
            if (t >= B(A.agent)) chat.style.transform = "scale(" + (0.92 + 0.08 * cu).toFixed(4) + ") translateX(" + (-1300 * out).toFixed(1) + "px)";
            var kAg = typeOn(agCh, t, A.type[0], A.type[1]);
            snap(me, t, A.reply, 99, 10);

            // the AI SDR email
            snap(email, t, A.email + 0.15, A.close, 24);
            if (t >= B(A.close)) email.style.opacity = 1 - io((t - B(A.close)) / 0.3);
            typeOn(subCh, t, A.subject[0], A.subject[1]);
            var kBody = typeOn(bodyCh, t, A.body[0], A.body[1]);
            snap(sent, t, A.sent, 99, 6);

            // wires from the cards to the words they shaped
            wireEls.forEach(function (w) {
              var k = w.src === "chat" ? kAg : kBody, live = w.src === "chat" ? (t >= B(A.agent) && t < B(A.email)) : (t >= B(A.email) && t < B(A.close));
              var at = w.src === "chat" ? B(A.type[0]) + (B(A.type[1]) - B(A.type[0])) * (w.startIdx / agCh.length) : B(A.body[0]) + (B(A.body[1]) - B(A.body[0])) * (w.startIdx / bodyCh.length);
              if (wire(w, t, at, live && k > w.startIdx)) w.card.classList.add("lit");
            });

            // the close
            snap(llogo, t, A.lockup, 99, 10); snap(lline, t, A.lockup + 0.25, 99, 10); snap(lurl, t, A.lockup + 0.5, 99, 8);
          }

          var drv = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(drv, { t: 0.001 }, { t: END, duration: END - 0.001, ease: "none", onUpdate: function () { draw(drv.t); }, immediateRender: false }, 0.001);
          // no draw at load: the runtime seeks the timeline for every frame, and DOM writes before it is ready throw
          window.__timelines["signals"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
