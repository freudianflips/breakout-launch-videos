<!doctype html>
<html>
  <body>
    <template>
      <!-- Signals launch. The world is the dot-matrix grid (visits are pink blooms of dots, Breakout violet, the rep cyan).
           Signals are free particles, re-created from the signals library art: the funding peak, the people trail,
           the hiring rings, the intent arcs. The library beat shows that art itself as tiles.
           Every frame is a pure function of time: frame(t) redraws everything from nothing. Built by build.py. -->
      <style>
        __FONTFACES__
        #root { position: absolute; inset: 0; overflow: hidden; }
        #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .cap { position: absolute; left: 64px; bottom: 58px; display: none; align-items: center; gap: 14px;
               font-family: "Manrope", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; color: #fff; }
        .cap i { width: 10px; height: 10px; border-radius: 50%; background: #ff5ad1; display: block; }
        .tag { position: absolute; display: none; font-family: "Fragment Mono", monospace; font-size: 19px; letter-spacing: 0.02em;
               color: #fff; padding: 7px 12px; border-radius: 8px; background: rgba(26, 21, 52, 0.82); border: 1px solid rgba(154, 149, 255, 0.45); white-space: nowrap; }
        #tiles { position: absolute; left: 162px; top: 200px; width: 1596px; display: grid; grid-template-columns: repeat(5, 300px); gap: 34px 24px; }
        .tile { margin: 0; opacity: 0; }
        .tile img { width: 300px; height: 188px; object-fit: cover; border-radius: 14px; display: block; border: 1px solid rgba(154, 149, 255, 0.3); }
        .tile figcaption { font-family: "Fragment Mono", monospace; font-size: 17px; color: #cfcbff; margin-top: 10px; letter-spacing: 0.01em; }
        #lock { position: absolute; left: 0; right: 0; top: 640px; text-align: center; display: none;
                font-family: "NK", serif; font-weight: 400; font-size: 60px; letter-spacing: -0.03em; color: #fff;
                font-variation-settings: "SOFT" 100, "opsz" 144, "WONK" 0; }
        #lock em { color: #be79ff; }
        #url { position: absolute; left: 0; right: 0; top: 735px; text-align: center; display: none;
               font-family: "Fragment Mono", monospace; font-size: 24px; color: #9a95ff; letter-spacing: 0.04em; }
      </style>
      <div id="root" data-composition-id="signals" data-width="1920" data-height="1080">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div id="tiles">__TILES__</div>
        __WHICH__
        __STREAMS__
        __CAPTIONS__
        <div id="lock">__LOCK__</div>
        <div id="url">__URL__</div>
      </div>
      <script>
        (function () {
          var T = __T__;
          var S = '[data-composition-id="signals"] ';
          function $$(q) { return Array.prototype.slice.call(document.querySelectorAll(S + q)); }
          var cv = document.querySelector(S + "#cv"), g = cv.getContext("2d");
          var caps = $$(".cap"), tiles = $$(".tile"), whichTags = $$(".which"), streamTags = $$(".stream");
          var lock = document.querySelector(S + "#lock"), url = document.querySelector(S + "#url");
          var W = 1920, H = 1080, P = 24, COLS = 80, ROWS = 45, N = COLS * ROWS;
          var BAR = 240 / T.bpm, BEAT = BAR / 4, END = T.bars * BAR;
          var A = {}; Object.keys(T.at).forEach(function (k) { A[k] = Array.isArray(T.at[k]) ? T.at[k].map(function (x) { return x * BAR; }) : T.at[k] * BAR; });
          function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
          var C = {}; Object.keys(T.colors).forEach(function (k) { C[k] = rgb(T.colors[k]); });
          var WHITE = [255, 255, 255];

          function cl(u) { return Math.max(0, Math.min(1, u)); }
          function lerp(a, b, u) { return a + (b - a) * u; }
          function mix(p, q, u) { return [lerp(p[0], q[0], u), lerp(p[1], q[1], u), lerp(p[2], q[2], u)]; }
          function snap(u) { u = cl(u); return u >= 1 ? 1 : 1 - Math.pow(2, -10 * u); }
          function pop(u) { u = cl(u); var v = u - 1; return Math.max(0, 1 + 2.7 * v * v * v + 1.7 * v * v); }
          function bump(t, t0, d) { var u = (t - t0) / d; return u < 0 || u > 1 ? 0 : Math.sin(Math.PI * u); }
          function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
          function on(t, a, b) { return t >= a && t < b; }

          // ---- the grid
          var I = new Float32Array(N), CR = new Float32Array(N), CG = new Float32Array(N), CB = new Float32Array(N);
          function put(i, v, c) { if (v > I[i]) { I[i] = v; CR[i] = c[0]; CG[i] = c[1]; CB[i] = c[2]; } }
          function cx(c) { return 12 + c * P; }
          function cy(r) { return 12 + r * P; }
          function area(x, y, R, fn) {
            var c0 = Math.max(0, Math.floor((x - R) / P)), c1 = Math.min(COLS - 1, Math.ceil((x + R) / P));
            var r0 = Math.max(0, Math.floor((y - R) / P)), r1 = Math.min(ROWS - 1, Math.ceil((y + R) / P));
            for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) fn(r * COLS + c, Math.hypot(cx(c) - x, cy(r) - y));
          }
          function bloom(p, R, amp, col) {
            if (amp <= 0 || R <= 0) return;
            area(p[0], p[1], R, function (i, d) { var u = 1 - d / R; if (u > 0) put(i, amp * Math.pow(u, 0.6), col); });
          }
          function core(p, R, amp) { bloom(p, R, amp, WHITE); }
          function ring(p, r, w, amp, col) {
            if (amp <= 0) return;
            area(p[0], p[1], r + w, function (i, d) { var u = 1 - Math.abs(d - r) / w; if (u > 0) put(i, amp * u, col); });
          }
          function ripple(t, t0, p, col, reach) {
            var u = (t - t0) / 0.7; if (u < 0 || u > 1) return;
            ring(p, 50 + (reach || 480) * snap(u * 1.4), 26, 0.85 * (1 - u), col);
          }
          function scan(t, t0, d) {
            if (t < t0 || t > t0 + d + 0.1) return;
            var sx = lerp(-80, W + 80, cl((t - t0) / d));
            for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) { var dx = Math.abs(cx(c) - sx); if (dx < 80) put(r * COLS + c, 0.8 * (1 - dx / 80), C.breakout); }
          }

          // ---- signals as particles, re-created from the library art. Each motif gives particle i a position
          // around its centre (about 260 x 170 px at scale 1) and a brightness, alive in time.
          var NP = 620;
          function motif(kind, i, tt) {
            var r1 = rnd(i * 3.1 + 1), r2 = rnd(i * 7.7 + 2), r3 = rnd(i * 1.9 + 3), x, y, b;
            if (kind === "funding") {                                  // the rising peak
              x = (r1 * 2 - 1) * 135; var h = 150 * Math.exp(-Math.pow(x / 42, 2)) * (1 + 0.06 * Math.sin(tt * 3)) + 12;
              var f = Math.sqrt(r2); y = 70 - h * f + (r3 - 0.5) * 10; b = 0.25 + 0.75 * f * (h / 162);
            } else if (kind === "people") {                            // a person moving: a trail between two clusters
              var pth = (r1 + tt * 0.35) % 1;
              if (r3 < 0.3) { pth = r3 < 0.15 ? 0.02 : 0.98; }
              x = -125 + 250 * pth; y = -45 * Math.tanh((pth - 0.5) * 5);
              var sp = r3 < 0.3 ? 26 : 12; x += (r2 - 0.5) * sp * 2; y += (rnd(i * 5.3) - 0.5) * sp * 2; b = 0.3 + 0.7 * pth;
            } else if (kind === "hiring") {                            // rings growing out of a centre
              var k = Math.floor(r1 * 6), rr = (k + ((tt * 0.9) % 1)) * 21, a = r2 * Math.PI * 2;
              x = Math.cos(a) * rr + (r3 - 0.5) * 6; y = Math.sin(a) * rr * 0.8 + (r3 - 0.5) * 6; b = 1 - rr / 135;
            } else {                                                   // intent: arcs going out like a broadcast
              var k2 = Math.floor(r1 * 4), rad = 30 + k2 * 36 + ((tt * 50) % 36), an = -0.95 + r2 * 1.9;
              x = -110 + Math.cos(an) * rad + (r3 - 0.5) * 7; y = Math.sin(an) * rad + (r3 - 0.5) * 7; b = 1 - k2 / 5;
            }
            return [x, y, cl(b)];
          }
          function dot(x, y, b, a, s) {
            if (a <= 0.01) return;
            var c = mix(C.particle, WHITE, b);
            g.fillStyle = "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a.toFixed(3) + ")";
            var sz = (1.6 + 2.2 * b) * (s || 1); g.fillRect(x - sz / 2, y - sz / 2, sz, sz);
          }
          // a motif that pops in at t0 around (px, py); m (0..1) pulls it into a small cluster at q, shrink k
          function drawMotif(kind, t, t0, at, scale, alpha, q, m, seed) {
            if (t < t0) return;
            for (var i = 0; i < NP; i++) {
              var born = t0 + rnd(i + seed) * 0.22; if (t < born) continue;
              var p = motif(kind, i, t - t0), e = pop((t - born) / 0.25);
              var x = at[0] + p[0] * scale * e, y = at[1] + p[1] * scale * e;
              if (m > 0) { x = lerp(x, q[0] + p[0] * 0.3, m); y = lerp(y, q[1] + p[1] * 0.3, m); }
              dot(x, y, p[2], alpha, 1.35 - 0.4 * m);
            }
          }

          // ---- positions
          var V0 = [960, 520], QPOS = [[470, 290], [1450, 290], [1450, 760], [470, 760]];
          var V1 = [640, 520], V2 = [1280, 520], WPOS = [[1280, 250], [1580, 560]];
          var FIELD = []; for (var f = 0; f < 22; f++) {
            var fx = 160 + (f % 6) * 320 + (rnd(f + 40) - 0.5) * 160, fy = 150 + Math.floor(f / 6) * 230 + (rnd(f + 80) - 0.5) * 90;
            FIELD.push([fx, Math.min(fy, 860)]); }
          var HOT = [8, 3, 16], HP = FIELD[8];
          var REP = [1480, 290], BK = [1000, 720], CENTER = [960, 520];
          var SRC = [[60, 190], [1860, 110], [1860, 930]];

          // ---- the logo, sampled onto the grid
          var logoMask = null;
          function getLogo() {
            if (logoMask) return logoMask;
            var o = document.createElement("canvas"); o.width = W; o.height = H; var x = o.getContext("2d");
            var vb = T.logo.vb, s = 1440 / vb[2];
            x.translate(960 - 720, 460 - vb[3] * s / 2); x.scale(s, s); x.translate(-vb[0], -vb[1]);
            T.logo.paths.forEach(function (p) { x.fillStyle = p[0]; x.fill(new Path2D(p[1])); });
            var d = x.getImageData(0, 0, W, H).data, out = [];
            for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
              var a = 0, cr = 0, cg = 0, cb = 0, n = 0;
              for (var yy = r * P + 2; yy < r * P + P; yy += 4) for (var xx = c * P + 2; xx < c * P + P; xx += 4) {
                var k = (yy * W + xx) * 4, al = d[k + 3] / 255; a += al; cr += d[k] * al; cg += d[k + 1] * al; cb += d[k + 2] * al; n++; }
              if (a / n > 0.06) out.push([r * COLS + c, Math.min(1, (a / n) * 1.25), [cr / a, cg / a, cb / a]]);
            }
            return (logoMask = out);
          }

          function frame(t) {
            I.fill(0);
            var q = A.q, parts = [];                                   // particle draws wait until the grid is down
            var dim = on(t, A.lib, A.hot) ? lerp(1, 0.35, snap((t - A.lib) / 0.2)) : 1;

            // ---- 1. the questions, then the turn
            if (t < A.two + 0.2) {
              var vR = 95 * pop(t / 0.3) * (1 + 0.6 * snap((t - A.turn - 0.3) / 0.25) * (t > A.turn ? 1 : 0));
              bloom(V0, vR, 1, C.visitor);
              if (t > A.turn + 0.3) core(V0, 55 * pop((t - A.turn - 0.3) / 0.3), 0.9);
              q.forEach(function (t0) { ripple(t, t0, V0, C.visitor, 260); });
              ripple(t, A.turn + 0.3, V0, WHITE, 700);
              parts.push(function () {
                T.motifs.forEach(function (kind, k) {
                  var th = k * Math.PI / 2 + Math.PI / 4 + 1.1 * Math.max(0, t - A.turn);
                  var qq = [V0[0] + Math.cos(th) * 250, V0[1] + Math.sin(th) * 250];
                  var m = snap((t - A.turn - k * 0.05) / 0.35);
                  drawMotif(kind, t, q[k], QPOS[k], 1.35, 1, qq, t > A.turn ? m : 0, k * 50);
                });
              });
            }
            scan(t, A.two, 0.4);

            // ---- 2. two visits; signals show which is which
            if (on(t, A.two + 0.2, A.lib)) {
              var s1 = pop((t - A.two - 0.2) / 0.3), s2 = pop((t - A.two - 0.2 - BEAT) / 0.3);
              var lit = snap((t - A.sort - 2.5 * BEAT) / 0.3);
              bloom(V1, 95 * s1, lerp(1, 0.55, lit), C.visitor);
              bloom(V2, 95 * s2 * (1 + 0.7 * lit), 1, C.visitor);
              if (lit > 0) core(V2, 70 * pop((t - A.sort - 2.5 * BEAT) / 0.3), 1);
              ripple(t, A.sort + 2.5 * BEAT, V2, WHITE, 700);
              ripple(t, A.sort + 3.5 * BEAT, V2, C.visitor, 500);
              parts.push(function () {
                T.which.forEach(function (kind, k) {
                  var t0 = A.sort + k * BEAT, th = k * Math.PI + 1.3 * Math.max(0, t - A.sort - 2 * BEAT);
                  var qq = [V2[0] + Math.cos(th) * 215, V2[1] + Math.sin(th) * 215];
                  drawMotif(kind, t, t0, WPOS[k], 1.05, 1, qq, snap((t - A.sort - (2 + k * 0.25) * BEAT) / 0.35), 300 + k * 50);
                });
              });
            }

            // ---- 3. the library: the real art, as tiles
            tiles.forEach(function (el, i) {
              var a = A.lib + i * BEAT / 4, b = A.hot + i * 0.02;
              if (t < a || t > b + 0.2) { el.style.opacity = 0; return; }
              var u = t < b ? snap((t - a) / 0.2) : 1 - snap((t - b) / 0.15);
              el.style.opacity = u.toFixed(3); el.style.transform = "translateY(" + (18 * (1 - u)).toFixed(1) + "px) scale(" + (0.9 + 0.1 * u).toFixed(3) + ")";
            });

            // ---- 4. many visits, a few to drop everything for
            if (on(t, A.hot, A.run)) {
              FIELD.forEach(function (p, i) {
                var hot = HOT.indexOf(i), born = A.hot + 0.1 + rnd(i + 5) * 0.35;
                if (t < born) return;
                var fade = i === HOT[0] ? 1 : 1 - snap((t - A.rep) / 0.2);
                if (fade <= 0) return;
                var R = 40 * pop((t - born) / 0.25), amp = 0.75 * fade;
                if (hot >= 0) { var ht = A.hot + (1 + hot) * BEAT; R *= 1 + 0.9 * snap((t - ht) / 0.2); if (t > ht) core(p, 34 * fade, fade); ripple(t, ht, p, WHITE, 300); }
                if (i === HOT[0] && t > A.run) return;
                bloom(p, R, amp, C.visitor);
              });
              parts.push(function () {                                 // every visit carries a few signals
                FIELD.forEach(function (p, i) {
                  var born = A.hot + 0.1 + rnd(i + 5) * 0.35; if (t < born) return;
                  var fade = (i === HOT[0] ? 1 : 1 - snap((t - A.rep) / 0.2)) * (t > A.run ? 0 : 1); if (fade <= 0) return;
                  var hot = HOT.indexOf(i), n = hot >= 0 ? 22 : 7, rr = hot >= 0 ? 78 : 52;
                  for (var j = 0; j < n; j++) { var a = rnd(i * 31 + j) * 6.283 + (t - born) * (0.8 + rnd(j)), e = pop((t - born) / 0.3);
                    dot(p[0] + Math.cos(a) * rr * e, p[1] + Math.sin(a) * rr * 0.8 * e, hot >= 0 ? 1 : 0.4, fade, hot >= 0 ? 1.2 : 0.9); }
                });
              });
            }

            // ---- 5. the rep gets the hook; the agent picks it up
            if (on(t, A.rep, A.run + 0.3)) {
              var rf = 1 - snap((t - A.run) / 0.2);
              bloom(REP, 70 * pop((t - A.rep) / 0.3) * rf * (1 + 0.5 * bump(t, A.rep + BEAT + 0.4, 0.35)), 1, C.rep);
              ripple(t, A.rep + BEAT + 0.4, REP, C.rep, 360);
              var hu = (t - A.rep - BEAT) / 0.4;                     // the hook travels along a line of dots
              if (hu > 0 && hu < 1.6) {
                var hf = 1 - cl(hu - 1);
                for (var s = 0; s <= 40; s++) { var fr = s / 40; if (fr > snap(hu)) continue;
                  area(lerp(HP[0], REP[0], fr), lerp(HP[1], REP[1], fr), 12, function (i, d) { if (d < 12) put(i, 0.7 * hf, C.rep); }); }
                if (hu < 1) parts.push(function () { var hx = lerp(HP[0], REP[0], snap(hu)), hy = lerp(HP[1], REP[1], snap(hu));
                  for (var j = 0; j < 60; j++) dot(hx + (rnd(j) - 0.5) * 44, hy + (rnd(j + 9) - 0.5) * 44, 1, 1, 1.3); });
              }
            }
            if (on(t, A.agent, A.close + 0.3)) {
              var bp = t < A.run ? BK : [lerp(BK[0], 1200, snap((t - A.run) / 0.2)), lerp(BK[1], 640, snap((t - A.run) / 0.2))];
              var bf = 1 - snap((t - A.run) / 0.2);
              bloom(bp, 110 * pop((t - A.agent) / 0.3) * bf, 1, C.breakout);
              [1, 3].forEach(function (b) { ripple(t, A.agent + b * BEAT, BK, C.breakout, 380); });
              ripple(t, A.agent + 2 * BEAT, HP, C.visitor, 320);
              var cu = (t - A.agent - 4.5 * BEAT) / 0.75;              // the follow-up: a comet out and back to her
              if (cu > 0 && cu < 1.05) parts.push(function () {
                for (var j = 0; j < 26; j++) { var u = cl(snap(cu) - j * 0.012), x = (1 - u) * (1 - u) * BK[0] + 2 * u * (1 - u) * 1500 + u * u * HP[0],
                  y = (1 - u) * (1 - u) * BK[1] + 2 * u * (1 - u) * 1000 + u * u * HP[1];
                  for (var z = 0; z < 4; z++) dot(x + (rnd(j * 4 + z) - 0.5) * 16, y + (rnd(j * 4 + z + 2) - 0.5) * 16, 1 - j / 26, 1 - j / 26, 1.3); }
              });
              ripple(t, A.agent + 4.5 * BEAT + 0.75, HP, C.visitor, 360);
            }

            // ---- 6. what you already run, poured onto the same account
            var hp = t < A.run ? HP : [lerp(HP[0], CENTER[0], snap((t - A.run) / 0.2)), lerp(HP[1], CENTER[1], snap((t - A.run) / 0.2))];
            if (on(t, A.run, A.close + 0.25)) {
              var full = snap((t - A.same) / 0.3), cf = 1 - snap((t - A.close) / 0.25);
              bloom(hp, (80 + 70 * full) * cf, 1, C.visitor);
              core(hp, (34 + 40 * full) * cf, 1);
              [0, 1, 2].forEach(function (k) { if (t > A.same + k * 0.08) ring(hp, (170 + 40 * k) * pop((t - A.same - k * 0.08) / 0.3), 16, 0.8 * cf, [C.particle, WHITE, C.rep][k]); });
              ripple(t, A.same, hp, WHITE, 700);
              parts.push(function () {
                SRC.forEach(function (src, k) {
                  var ts = A.run + k * 1.5 * BEAT; if (t < ts) return;
                  var front = snap((t - ts) / 0.5), drain = cl((t - A.same - 0.3) / 0.5);
                  var ctrl = [lerp(src[0], hp[0], 0.5) + (k - 1) * 160, lerp(src[1], hp[1], 0.5) - 120];
                  for (var j = 0; j < 320; j++) { var u = (rnd(j + k * 999) + (t - ts) * 0.9) % 1; if (u > front || u < drain) continue;
                    var x = (1 - u) * (1 - u) * src[0] + 2 * u * (1 - u) * ctrl[0] + u * u * hp[0], y = (1 - u) * (1 - u) * src[1] + 2 * u * (1 - u) * ctrl[1] + u * u * hp[1];
                    dot(x + (rnd(j + 3) - 0.5) * 26, y + (rnd(j + 7) - 0.5) * 26, u, 1, 1.5); }
                });
              });
            }

            // ---- 7. close: collapse, shockwave, the wordmark in dots
            var su = (t - A.close - 0.2) / 0.8;
            if (su > 0 && su < 1) { ring(CENTER, 2300 * snap(su), 110, 1 - su, mix(C.visitor, C.breakout, su));
              for (var i2 = 0; i2 < N; i2++) put(i2, 0.28 * (1 - su), C.breakout); }
            if (t >= A.close + 2 * BEAT) getLogo().forEach(function (m) { var o = A.close + 2 * BEAT + (m[0] % COLS) / COLS * 0.4;
              if (t >= o) put(m[0], m[1] * pop((t - o) / 0.22), m[2]); });

            // ---- draw: the grid (popping on in a diagonal sweep at the start), then the particles
            g.fillStyle = T.colors.ground; g.fillRect(0, 0, W, H);
            for (var r3 = 0; r3 < ROWS; r3++) for (var c3 = 0; c3 < COLS; c3++) {
              var idx = r3 * COLS + c3, v = I[idx], x3 = cx(c3), y3 = cy(r3);
              if (v < 0.03) {
                var on3 = (c3 + r3) * 0.004; if (t < on3) continue;
                g.fillStyle = "rgba(" + C.dot.join(",") + "," + dim + ")";
                g.beginPath(); g.arc(x3, y3, Math.max(0, 1.8 * pop((t - on3) / 0.2)), 0, 7); g.fill(); continue;
              }
              var k3 = Math.min(1, v * 1.6);
              g.fillStyle = "rgb(" + Math.round(lerp(C.dot[0], CR[idx], k3)) + "," + Math.round(lerp(C.dot[1], CG[idx], k3)) + "," + Math.round(lerp(C.dot[2], CB[idx], k3)) + ")";
              g.beginPath(); g.arc(x3, y3, Math.max(0, 1.8 + 9.2 * v), 0, 7); g.fill();
            }
            parts.forEach(function (fn) { fn(); });

            // ---- words: captions, tags, the close
            T.caps.forEach(function (cp, k) { var a = cp[0] * BAR, b = cp[1] * BAR, el = caps[k];
