<!doctype html>
<html>
  <body>
    <template>
      <!-- Two-hander: two people on a white seamless, cut on the dialogue, with claim cards, subtitles and the end card.
           Built by build.py from film.json and timing from the voice lines. Every frame is a pure function of t. -->
      <style>
        __FONTFACES__
        [data-composition-id="two"] { --ink: #040405; --ink2: #5c5850; --violet: #4c00ff; --grey: #17161b;
          --sans: "Manrope", system-ui, sans-serif; --mono: "Fragment Mono", ui-monospace, monospace; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #fff; font-family: var(--sans); color: var(--ink); }
        .nk { font-family: "NK", serif; font-weight: 400; font-variation-settings: "SOFT" 100, "opsz" 144, "WONK" 0; letter-spacing: -0.035em; line-height: 1; }
        .nk em { font-style: italic; color: var(--violet); }
        .mono { font-family: var(--mono); }

        .shot { position: absolute; inset: 0; overflow: hidden; visibility: hidden; background: #fff; }
        .shot img { position: absolute; left: 0; top: 0; width: 1920px; transform-origin: 50% 30%; }
        #s-two img.bg, #s-two img.ppl { height: 1080px; object-fit: cover; transform-origin: 48% 42%; }
        #s-breakout img, #s-piper img { top: -40px; }
        #s-two #sarah { left: 0; top: 200px; width: auto; height: 940px; visibility: hidden; filter: blur(1.2px); }   /* a cut-out, a step behind them */
        .tag, .claim, #source, .sub { z-index: 5; }
        #endc { z-index: 6; }

        .tag { position: absolute; top: 64px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.92);
          font-size: 24px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; visibility: hidden; box-shadow: 0 10px 30px -14px rgba(20, 11, 60, 0.35); }
        #tagB { left: 674px; color: var(--violet); }
        #tagP { left: 1179px; color: var(--grey); }

        .claim { position: absolute; left: 64px; top: 60px; min-width: 430px; max-width: 640px; padding: 22px 26px 20px; border-radius: 18px; background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 30px 70px -36px rgba(20, 11, 60, 0.45), 0 0 0 1px rgba(20, 11, 60, 0.08); visibility: hidden; }
        .clab { font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); margin-bottom: 14px; }
        .crow { display: flex; align-items: baseline; gap: 18px; font-size: 30px; line-height: 1.25; margin-bottom: 6px; }
        .crow span { width: 128px; flex: none; font-size: 19px; font-weight: 700; }
        .crow.b span, .crow.b b { color: var(--violet); }
        .crow.q span, .crow.q b { color: #77737e; font-weight: 600; }
        .cnote { margin-top: 12px; font-size: 15px; font-family: var(--mono); color: var(--ink2); }
        #source { position: absolute; left: 56px; bottom: 30px; padding: 5px 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.86); font-size: 16px; color: var(--ink2); visibility: hidden; }

        .lower { position: absolute; left: 64px; bottom: 170px; padding: 14px 20px; border-radius: 14px; background: rgba(255, 255, 255, 0.94); z-index: 5; visibility: hidden;
          box-shadow: 0 24px 50px -30px rgba(20, 11, 60, 0.45); }
        .lower b { display: block; font-size: 28px; font-weight: 700; color: var(--ink); }
        .lower span { display: block; margin-top: 6px; font-size: 15px; color: var(--ink2); }
        .sub { position: absolute; left: 0; right: 0; bottom: 92px; text-align: center; visibility: hidden; }
        .sub span { display: inline-block; padding: 10px 22px; border-radius: 12px; background: rgba(4, 4, 5, 0.72); color: #fff; font-size: 36px; font-weight: 600; letter-spacing: -0.01em; }

        #endc { position: absolute; inset: 0; background: #fff; visibility: hidden; }
        #endlogo { position: absolute; left: 50%; top: 380px; width: 470px; transform: translateX(-50%); }
        #endline { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font-size: 132px; }
      </style>
      <div id="root" data-composition-id="two" data-width="1920" data-height="1080">
        <div class="shot" id="s-two"><img class="bg" src="assets/two.png" alt=""><img id="sarah" src="assets/sarah.png" alt=""><img class="ppl" src="assets/people.png" alt=""></div>
        <div class="shot" id="s-breakout"><img src="assets/breakout.png" alt=""></div>
        <div class="shot" id="s-piper"><img src="assets/piper.png" alt=""></div>
        __TAGS__
        __CLAIMS__
        <div id="source" class="mono">__SOURCE__</div>
        __SUBS__
        <div id="endc"><img id="endlogo" src="assets/logo.svg" alt=""><div id="endline" class="nk">__ENDLINE__</div></div>
      </div>
      <script>
        (function () {
          var T = __T__;
          var S = '[data-composition-id="two"] ';
          var q = function (sel) { return document.querySelector(S + sel); };
          var tl = gsap.timeline({ paused: true });
          tl.set(S + '.shot, ' + S + '.claim, ' + S + '.sub, ' + S + '.tag, ' + S + '.lower, #source, #endc, #sarah', { autoAlpha: 0 }, 0);

          // shots: a hard cut on each change of frame, a slow push while it holds
          T.cuts.forEach(function (c) {
            var el = q('#s-' + c.frame), img = el.querySelectorAll('img.bg, img.ppl, .shot > img:only-child'), k = c.frame === 'two' ? 1.34 : 1.0;   // the 2-shot plays knees-up
            tl.set(el, { autoAlpha: 1 }, c.start);
            tl.set(el, { autoAlpha: 0 }, c.end);
            tl.fromTo(img, { scale: k }, { scale: k * 1.035, duration: c.end - c.start, ease: 'none', immediateRender: false }, c.start);
          });

          T.beats.forEach(function (b) {
            var off = (T.beats[T.beats.indexOf(b) + 1] || { start: T.end }).start - 0.35;
            if (b.names) {
              tl.fromTo(S + '.tag', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.25, immediateRender: false }, b.start + 0.1);
              tl.to(S + '.tag', { autoAlpha: 0, duration: 0.25 }, off);
            }
            if (b.claim) {
              var c = q('#claim' + b.beat);
              tl.fromTo(c, { autoAlpha: 0, y: 14, filter: 'blur(8px)' }, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out', immediateRender: false }, b.start + 0.2);
              tl.to(c, { autoAlpha: 0, duration: 0.25 }, off);
              tl.set('#source', { autoAlpha: 1 }, b.start + 0.2);
              tl.set('#source', { autoAlpha: 0 }, off + 0.25);
            }
            if (b.sarah) {   // she crosses behind them, right to left; "sarah": seconds before the beat's first line
              var s0 = b.start - (b.sarah === true ? 0.2 : b.sarah);
              tl.set('#sarah', { autoAlpha: 1 }, s0);
              tl.fromTo('#sarah', { x: 1960 }, { x: -640, duration: 4.6, ease: 'none', immediateRender: false }, s0);
              tl.set('#sarah', { autoAlpha: 0 }, s0 + 4.6);
            }
            if (b.lower) {
              var lw = q('#lower' + b.beat);
              tl.fromTo(lw, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, b.start + 0.1);
              tl.to(lw, { autoAlpha: 0, duration: 0.25 }, off);
            }
          });

          T.lines.forEach(function (l, i) {
            var el = q('#sub' + i);
            if (!el) return;
            var next = T.lines[i + 1] ? T.lines[i + 1].start - 0.05 : l.end + 0.3;
            tl.set(el, { autoAlpha: 1 }, l.start - 0.05);
            tl.set(el, { autoAlpha: 0 }, Math.min(l.end + 0.25, next));
          });

          // end card: white, the logo rises, the line racks into focus
          tl.set('#endc', { autoAlpha: 1 }, T.end);
          tl.fromTo('#endlogo', { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out', immediateRender: false }, T.end + 0.1);
          tl.fromTo('#endline', { autoAlpha: 0, y: 18, filter: 'blur(10px)' }, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out', immediateRender: false }, T.end + 0.55);
          tl.set({}, {}, T.total);
          window.__timelines = window.__timelines || {};
          window.__timelines["two"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
